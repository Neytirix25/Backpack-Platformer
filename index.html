  #acc h2{margin:0 0 10px;font-size:24px;color:#ffd36b;text-align:center}
  #acc p{margin:8px 0;line-height:1.35}
  #acc .dim{color:#c9b08a;font-size:13px}
  #acc .err{color:#ff9a7a;min-height:1.2em}
  #acc label{display:block;margin:10px 0 4px;font-size:14px;color:#e2c99a}
  #acc input{width:100%;box-sizing:border-box;height:42px;padding:0 10px;border-radius:8px;border:2px solid #8a6a3a;background:#fff6dc;color:#3a2410;font:17px "Segoe UI",system-ui,sans-serif}

<script>
'use strict';
// =====================================================================
//  BACKPACK SANCTUARY — a side-scrolling roguelike with backpack management
// =====================================================================
let W = 960, H = 540; const GRAV = 1500;   // W x H = what is being drawn right now (see VIEW)
// VIEW: the canvas. Landscape it is 960x540. Held upright (portrait) it is 540 wide and as tall as the screen's shape, so
// nothing shrinks: the world is drawn in the 540x540 square at the top with a panel of HUD below it (drawPortraitHUD).
// Screens that don't have a portrait layout yet are drawn at 960x540 into LEG and fitted across the width (VIEW.legacy).
const VIEW = { portrait: false, w: 960, h: 540, legacy: false, s: 1, oy: 0 };
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
const LEG = (() => { const c = document.createElement('canvas'); c.width = 960; c.height = 540; return { cv: c, ctx: c.getContext('2d') }; })();
function fit() {   // landscape: 16:9; portrait: a canvas the shape of the screen, so the game fills it at full size
  const port = innerHeight > innerWidth * 1.1;
  VIEW.portrait = port; VIEW.w = port ? 540 : 960; VIEW.h = port ? Math.max(760, Math.min(1300, Math.round(540 * innerHeight / innerWidth))) : 540;
  if (cv.width !== VIEW.w || cv.height !== VIEW.h) { cv.width = VIEW.w; cv.height = VIEW.h; }
  const s = Math.min(innerWidth / VIEW.w, innerHeight / VIEW.h); cv.style.width = VIEW.w * s + 'px'; cv.style.height = VIEW.h * s + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200)); fit();

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function wpick(entries) {
  let t = 0; for (const e of entries) t += Math.max(0, e[1]);
  let r = Math.random() * t;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let TIME = 0;

// =====================================================================
//  ART — pixel sprites in ./assets (made with ChatGPT, pixelated by tools/pixelate.py).
//  Anything missing falls back to the original code-drawn graphics.
// =====================================================================
const PX = 2;  // world sprites are drawn at 2x
const BUILD = '20261114b';   // the release (same as the ?v= on the data scripts above): bump both when art or data changes
const ART = {};
// ability effect sprites (assets/vfx): three ChatGPT sheets cut by tools/pixelate.py vfx
const VFX_SPR = ['star', 'fireball', 'flame', 'spark', 'meteor', 'sun', 'moon', 'feather', 'note', 'wave', 'plus', 'bubble',
  'claw', 'bite', 'impact', 'poison', 'acid', 'skull', 'wisp', 'rune', 'eye', 'drop', 'stars', 'lava',
  'rock', 'dust', 'coin', 'swirl', 'tongue', 'shard', 'rainbow', 'orb', 'crack', 'heart', 'ray', 'leaf',
  'vine', 'thorn', 'petal', 'lily', 'splash', 'whirl', 'spore', 'pixie', 'antler', 'paw', 'mist', 'acorn'];   // vfx4: the Fey Wilds
// backgrounds cut into three depth layers for parallax: assets/bg/<key>_far / _mid / _near (same size as <key>.png;
// far is complete, mid and near are transparent around their pieces)
const BG_LAYERED = ['hall', 'cave', 'crypt', 'forge', 'hollow', 'sanctum', 'thornwood', 'glade', 'lake', 'camp', 'boss', 'temple', 'coral', 'trench'];
// how far each layer travels (far, mid, near): the near layer moves like the old single backdrop; a background whose middle pieces
// sit close to its back wall (banners on a wall) gives them a number close to the far one, so they don't slide across it
const BG_DEPTH = { default: [0.35, 0.65, 1], hall: [0.35, 0.42, 1], crypt: [0.35, 0.55, 1], boss: [0.35, 0.45, 1] };
const ART_FILES = {
  vfx: VFX_SPR,
  items: ['dish_minnow', 'dish_bluegill', 'dish_crawdad', 'dish_perch', 'dish_sunfish', 'dish_carp', 'dish_pike', 'dish_catfish', 'dish_pufferfish', 'dish_eel', 'dish_sturgeon', 'dish_goldkoi', 'fish_minnow', 'fish_bluegill', 'fish_crawdad', 'fish_perch', 'fish_sunfish', 'fish_carp', 'fish_pike', 'fish_catfish', 'fish_pufferfish', 'fish_eel', 'fish_sturgeon', 'fish_goldkoi', 'pet_fox', 'pet_owl', 'pet_ferret', 'pet_boar', 'pet_toad', 'shortbow', 'greatsword', 'warhammer', 'towershield', 'torc', 'banner', 'breastplate', 'bgauntlet', 'giantbelt', 'lionheart', 'dragonslayer', 'longbow', 'bodkin', 'twinquiver', 'frostarrows', 'blastarrows', 'hawkeye', 'bracer', 'rangercloak', 'fletching', 'starfall', 'venom', 'kris', 'shadowcloak', 'knives', 'lockpicks', 'duelist', 'shadowstep', 'bloodring', 'rmask', 'nightfang', 'barbwhip', 'alphahorn', 'collar', 'totem', 'poultice', 'falconglove', 'whistle', 'wolfcloak', 'bearclaw', 'crown', 'pet_dog', 'pet_catgray', 'pet_catcalico', 'pet_cockatiel', 'pet_dragon', 'wings', 'phoenix', 'treats', 'hourglass', 'lantern', 'dagger', 'arrows', 'sword', 'axe', 'spear', 'bow', 'gloves', 'shield', 'helm', 'chain', 'spiked', 'boots', 'potion', 'bomb', 'bread', 'heart', 'whetstone', 'charm', 'fang', 'clover', 'spikes', 'chewbone', 'clawfile', 'vest', 'blanket', 'incubator', 'harness', 'bell', 'huntmark', 'squeaky', 'catnip', 'cuttlebone', 'heatrock', 'bogmoss', 'truffle', 'nightshade', 'hexcharm', 'healbell', 'dragonheart', 'alphafang', 'salve', 'herb', 'salts', 'brew', 'smoke', 'net', 'egg_cockatiel', 'egg_owl', 'egg_toad', 'egg_dragon', 'egg_elder', 'horseshoe', 'glownectar', 'embertotem', 'boneflute', 'serpenttorc', 'antlercrown', 'saddlebag', 'buckler', 'windchimes', 'huntinghorn', 'emberring', 'wishbone', 'egg_phoenix', 'egg_salamander', 'egg_tortoise', 'egg_moth', 'egg_fairydragon', 'egg_viper', 'egg_sunday'],
  chars: ['hero', 'slime', 'bat', 'skeleton', 'archer', 'ghost', 'brute', 'boss'].flatMap(n => [n + '_idle', n + '_attack']),
  props: ['doghouse', 'oven', 'creel', 'dock_deck', 'dock_post', 'dock_end', 'door_menagerie', 'vine_curtain', 'friend_post', 'hub_banner_warrior', 'hub_banner_archer', 'hub_banner_rogue', 'hub_banner_beastmaster', 'hub_mirror', 'hub_board', 'hub_petbed', 'barrier', 'cage', 'cage_open', 'plant_bloodberry', 'plant_ember', 'plant_stone', 'plant_swift', 'plant_catnip', 'plant_mandrake', 'chest_secret', 'spikes', 'crumble', 'vent', 'chest_gold', 'chest_closed', 'chest_open', 'campfire', 'torch', 'gate', 'ledge', 'tombstone', 'arrow', 'mushrooms', 'candle', 'bones', 'chain', 'thorns', 'shroom', 'vine', 'door_wardrobe', 'door_records', 'door_den', 'door_out', 'nest', 'pedestal', 'trophy_shelf', 'dye_rack', 'sparkle_0', 'sparkle_1', 'sparkle_2', 'sparkle_3', 'sanct_house'],
  bgfx: [...new Set(Object.values(window.BGFX || {}).flat().flatMap(e => [e.s, e.m]).filter(Boolean))],   // strips, masks and swaying parts
  bg: ['hall', 'cave', 'crypt', 'camp', 'boss', 'forge', 'hollow', 'sanctum', 'hub', 'thornwood', 'glade', 'lake', 'yard', 'wardrobe', 'records', 'temple', 'coral', 'trench', 'menagerie', 'pond_bank'].concat(BG_LAYERED.flatMap(k => [k + '_far', k + '_mid', k + '_near'])).concat(['yard_far', 'yard_fields', 'yard_fence', 'yard_grass']),
  anim: Object.keys(window.ANIMS || {}).concat(window.LOOKS ? window.LOOKS.masks.map(n => n + '_skin').concat(Object.entries(window.LOOKS.hair).flatMap(([h, v]) => Object.keys(v).map(w => 'hair_' + h + '_' + w))) : []),   // + skin masks and hair pieces (Wardrobe)
  ui: ['panel_leather', 'panel_parch', 'btn', 'btn_hover', 'btn_off', 'slot', 'banner', 'seal'].concat(['burn', 'poison', 'bleed', 'stun', 'blind', 'weak', 'mark', 'shield', 'regen', 'str', 'guard', 'taunt', 'evade', 'lucky', 'undying', 'charging'].map(k => 'st_' + k)),   // st_*: status icons
  tiles: ['hall', 'cave', 'crypt', 'boss', 'camp', 'forge', 'hollow', 'sanctum', 'thornwood', 'glade', 'lake', 'temple', 'coral', 'trench'].flatMap(t => [t + '_block', t + '_top', t + '_ledge']),
};
// which animation sheet each character uses
const ANIM_OF = { slime: 'slime', bat: 'bat', skeleton: 'skeleton', archer: 'goblin', ghost: 'ghost', brute: 'brute', boss: 'warden',
                  imp: 'imp', golem: 'golem', cultist: 'cultist', spider: 'spider', knight: 'knight' };
function animFrames(name, anim) { const A = window.ANIMS && window.ANIMS[name]; return (A && art('anim/' + name) && A.anims[anim]) || null; }
function animLen(name, anim) { const f = animFrames(name, anim); return f ? f.length : 0; }
// draw frame i of an animation with its anchor (feet, or body centre for flyers) at (x, y)
// sheets drawn with extra detail (more pixels) than their on-screen size: shrink them back so they match the others
const ANIM_SCALE = { pet_lakewyrm: 22 / 32 };
function drawAnim(name, anim, i, x, y, face = 1, o = {}) {
  const fr = animFrames(name, anim); if (!fr || !fr.length) return false;
  const img = art('anim/' + name), n = fr.length;
  if (!Number.isFinite(i)) i = 0;   // never crash on a not-yet-started animation clock
  const [fx, fy, fw, fh, ax, ay] = fr[((Math.floor(i) % n) + n) % n];
  const s = (o.scale || PX) * (ANIM_SCALE[name] || 1);
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(x), Math.round(y));
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(face * (o.sx || 1), o.sy || 1);
  ctx.drawImage(img, fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s);
  if (o.flash) { ctx.globalAlpha *= 0.85; ctx.drawImage(whiteOf(img), fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s); }
  if (o.shadow) ctx.drawImage(blackOf(img), fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s);
  ctx.restore();
  return true;
}
// (legacy) row of each Act I background where its painted floor starts
const BG_FLOOR = { hall: 237, cave: 237, crypt: 237, camp: 237, boss: 237, hub: 230 };
function loadArt(dir, n, tries = 0) {
  const img = new Image();
  img.onload = () => {
    ART[dir + '/' + n] = img;
    try { if (G && G.room && G.room.terrain && dir === 'props') G.room.terrain = bakeTerrain(G.room); } catch (e) { /* game not started yet */ }
  };
  img.onerror = () => { if (tries < 3) setTimeout(() => loadArt(dir, n, tries + 1), 400 * (tries + 1)); };
  img.src = `assets/${dir}/${n}.png?v=${BUILD}` + (tries ? `&r=${tries}` : '');   // ?v: a new release never shows old cached art
}
for (const [dir, names] of Object.entries(ART_FILES)) for (const n of names) loadArt(dir, n);
const art = k => ART[k] || null;
const whiteCache = new Map();
const blackCache = new Map();
function blackOf(img) { // solid dark silhouette (pets you haven't rescued yet)
  let c = blackCache.get(img);
  if (!c) {
    c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#0b0a12'; g.fillRect(0, 0, c.width, c.height);
    blackCache.set(img, c);
  }
  return c;
}
function whiteOf(img) { // solid white silhouette for hit flashes
  let c = whiteCache.get(img);
  if (!c) {
    c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    whiteCache.set(img, c);
  }
  return c;
}
// draw a sprite with its bottom-centre at (cx, by); face -1 mirrors it. opts: sx, sy (squash), alpha, flash, rot, scale, center
function drawSprite(img, cx, by, face = 1, o = {}) {
  if (!img) return;
  const C = o.g || ctx;
  const s = (o.scale || PX), w = img.width * s * (o.sx || 1), h = img.height * s * (o.sy || 1);
  C.save();
  C.imageSmoothingEnabled = false;
  if (o.alpha !== undefined) C.globalAlpha *= o.alpha;
  C.translate(Math.round(cx), Math.round(o.center ? by : by - h / 2));
  if (o.rot) C.rotate(o.rot);
  if (face < 0) C.scale(-1, 1);
  C.drawImage(img, -w / 2, -h / 2, w, h);
  if (o.flash) { C.globalAlpha *= 0.85; C.drawImage(whiteOf(img), -w / 2, -h / 2, w, h); }

// keep a character's back edge planted when switching to a wider/narrower pose
function poseX(idle, img, cx, face) { return idle ? cx + face * (img.width - idle.width) * PX / 2 : cx; }

// SAVE SLOTS: every copy of the game keeps its own progress. Chrome gives all pages opened from disk (file://) one
// shared storage, so progress keys are tagged with the folder this copy lives in -> a freshly downloaded copy starts
// fresh. (Sound/music settings stay shared on purpose.)
const SAVE_KEYS = ['packrat_best', 'packrat_coll', 'packrat_records', 'packrat_skin', 'packrat_class', 'packrat_pets', 'packrat_team', 'packrat_ach', 'packrat_herd', 'packrat_den', 'packrat_yard'];
const SAVE_DIR = (() => { try { return decodeURIComponent(location.pathname).replace(/\\/g, '/').replace(/[^\/]*$/, '').toLowerCase(); } catch (e) { return '/'; } })();
const SLOT = (() => { let h = 2166136261; for (let i = 0; i < SAVE_DIR.length; i++) { h ^= SAVE_DIR.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); })();
function sk(k) { return k + '@' + SLOT; }
// a one-time fresh start for the development copy (requested 2026-11-11): its progress is cleared once, then kept
(() => { try {
  const RESET = 'dev-2026-11-11';
  if (!SAVE_DIR.endsWith('/games/backpack sanctuary/') || localStorage.getItem(sk('packrat_reset')) === RESET) return;
  for (const k of SAVE_KEYS) localStorage.removeItem(sk(k));
  localStorage.setItem(sk('packrat_reset'), RESET);
} catch (e) {} })();
// the development folder keeps its progress: 'backpack sanctuary' (renamed from 'pack-rat-dungeon') takes over the old
// folder's save if one sits next to it, otherwise the single shared save from before saves were split per copy
(() => { try {
  const parts = SAVE_DIR.split('/').filter(Boolean), name = parts.pop();
  if (name !== 'pack-rat-dungeon' && name !== 'backpack sanctuary') return;
  if (localStorage.getItem(sk('packrat_reset'))) return;   // started fresh on purpose: don't bring the old save back
  if (SAVE_KEYS.some(k => localStorage.getItem(sk(k)) !== null)) return;
  const oldDir = '/' + parts.join('/') + '/pack-rat-dungeon/';
  let h = 2166136261; for (let i = 0; i < oldDir.length; i++) { h ^= oldDir.charCodeAt(i); h = Math.imul(h, 16777619); }
  const oldSlot = (h >>> 0).toString(36), fromOld = name !== 'pack-rat-dungeon' && SAVE_KEYS.some(k => localStorage.getItem(k + '@' + oldSlot) !== null);
  for (const k of SAVE_KEYS) { const v = localStorage.getItem(fromOld ? k + '@' + oldSlot : k); if (v !== null) localStorage.setItem(sk(k), v); }
} catch (e) {} })();
function loadBest() { try { return +localStorage.getItem(sk('packrat_best')) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(sk('packrat_best'), String(v)); } catch (e) {} }
let BEST = loadBest();

// ---------- input ----------
const keys = {}; let pressed = {};
const norm = k => k.length === 1 ? k.toLowerCase() : k;
addEventListener('keydown', e => {
  const k = norm(e.key);
  if (accShown()) return;   // typing in the account window
  SFX.init();
  if (NET.typing) { netType(e); return; }   // typing a name or a room code
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[norm(e.key)] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const down = (...ks) => ks.some(k => keys[k]);
const hit = (...ks) => ks.some(k => pressed[k]);

const mouse = { x: 0, y: 0 };
function mpos(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * VIEW.w / r.width, y = (e.clientY - r.top) * VIEW.h / r.height;
  if (VIEW.legacy) { mouse.x = x / VIEW.s; mouse.y = (y - VIEW.oy) / VIEW.s; } else { mouse.x = x; mouse.y = y; }
}
cv.addEventListener('mousemove', e => {
  mpos(e);
  if (!G && SCREEN === 'class') { const c = classCardAt(mouse); if (c && c !== selClass) { selClass = c; SFX.play('rotate'); } }
});
cv.addEventListener('mousedown', e => { SFX.init(); mpos(e); onMouseDown(e.button); e.preventDefault(); });
addEventListener('mouseup', e => { mpos(e); onMouseUp(e.button); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (rosterOpen()) { scrollRoster(e.deltaY * (e.deltaMode === 1 ? 36 : 0.7)); e.preventDefault(); } else if (G && G.panel === 'trade') { tradeScroll(e.deltaY * (e.deltaMode === 1 ? 36 : 0.7)); e.preventDefault(); } }, { passive: false });

// ---------- touch: play the whole game on a phone or tablet ----------
// In the world (walking about): drag a thumb anywhere to move (up = jump / climb, down = drop), a quick sideways flick
// dashes, a quick tap uses what's nearby (E) or taps a button on the HUD, and a second finger taps a jump.
// In menus and battles: a quick tap clicks, dragging drags (backpack items), lists scroll with a swipe; holding a finger

function transposeSong(S, n, extra = {}) {
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], NI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

  const tn = s => s.replace(/([A-G])(#|b)?(-?\d)/g, (_, l, a, o) => { const m = 12 * (+o + 1) + NI[l] + acc(a) + n; return NAMES[m % 12] + (Math.floor(m / 12) - 1); });
  const tc = c => { const m = /^([A-G])(#|b)?(m?)$/.exec(c); return NAMES[(NI[m[1]] + acc(m[2]) + n + 24) % 12] + m[3]; };
  return Object.assign({}, S, extra, { chords: S.chords.map(tc), parts: S.parts.map(p => (p.mel ? Object.assign({}, p, { mel: p.mel.map(tn) }) : p)) });
}

function burst(x, y, color, n = 12, spd = 200, size = 4) {
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.3, 0.7), max: 0.7, color, size: rand(size * 0.6, size * 1.4), grav: 600 }); }
}
function ring(x, y, r, color) { G.parts.push({ ring: true, x, y, r: 10, maxR: r, life: 0.35, max: 0.35, color }); }
function addText(x, y, txt, color = '#fff', size = 15) { G.texts.push({ x, y, txt, color, size, life: 0.9 }); }
function updateFx(dt) {
  for (const p of G.parts) {
    p.life -= dt;
    if (p.ring) { p.r += (p.maxR - p.r) * Math.min(1, dt * 14); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (G.room && isSolidT(tileAt(Math.floor(p.x / TILE), Math.floor(p.y / TILE)))) { p.y -= p.vy * dt; p.vy *= -0.3; p.vx *= 0.6; }
  }
  G.parts = G.parts.filter(p => p.life > 0);

  for (const t of G.texts) { t.life -= dt; t.y -= 40 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  G.shake *= Math.pow(0.0005, dt);
  if (G.msgT > 0) G.msgT -= dt;
}

function updatePlayer(dt) {
  const P = G.player, s = stats, R = G.room;
  const mv = (down('a', 'ArrowLeft') ? -1 : 0) + (down('d', 'ArrowRight') ? 1 : 0);
  P.dashT -= dt; P.dashCd -= dt;
  // dash: a short invulnerable burst — once in the air until you land again
  if (hit('Shift', 'l') && P.dashCd <= 0 && (P.onGround || !P.airDashed)) {
    P.dashDir = TOUCH.flickDir || mv || P.face; P.face = P.dashDir; TOUCH.flickDir = 0; /* (a second-finger flick dashes its own way) */ P.dashHits = new Set(); P.dashT = 0.17; P.dashCd = 0.6 * s.dashMul; P.vy = 0;
    if (!P.onGround) P.airDashed = true;
    SFX.play('dash'); burst(P.x + P.w / 2, P.y + P.h - 6, '#d7dcff', 8, 120, 3);
  }
  if (P.dashT <= 0 && overlapsTile(P, PHASE)) P.dashT = 0.04;   // never stop inside an arcane barrier
  const dashing = P.dashT > 0;
  if (dashing) { P.vx = P.dashDir * 720; P.vy = 0; P.trail.push({ x: P.x, y: P.y, face: P.face, t: 0.22 }); }
  else {
    const ctrl = P.inv > 0.55 ? 0.15 : 1;
    P.vx += (mv * s.moveSpeed - P.vx) * Math.min(1, dt * 14 * ctrl);
    if (mv && P.swing <= 0) P.face = mv;
  }
  for (const t of P.trail) t.t -= dt;
  P.trail = P.trail.filter(t => t.t > 0);
  // vines (Fey Wilds): hold up on one to climb, down to slide, step sideways off it to let go
  const onVine = !dashing && vineUnder(P);
  if (P.climbing && !onVine) { P.climbing = false; if (down('w', 'ArrowUp', 'k')) P.vy = -430; }   // pull yourself up onto the ledge above
  else if (!P.climbing && onVine && down('w', 'ArrowUp', 'k')) {
    P.climbing = true; P.vy = 0;
    if (!(G.hints && G.hints.vine)) { G.hints = G.hints || {}; G.hints.vine = true; showMsg('A vine! Hold W to climb it, S to slide down.', 2.6); }
  }
  P.bounceT = (P.bounceT || 0) - dt;
  if (hit('w', 'ArrowUp', 'k') && !dashing && !P.climbing) {
    if (P.onGround) { P.vy = -s.jumpV; P.onGround = false; SFX.play('jump'); }
    else if (P.airJumps > 0) { P.airJumps--; P.vy = -s.jumpV * s.airPow; SFX.play('flap'); burst(P.x + P.w / 2, P.y + P.h, '#ffffff', 10, 140, 3); } // Winged Boots
  }
  if (!down('w', 'ArrowUp', 'k') && P.vy < -200 && !(P.bounceT > 0)) P.vy += GRAV * dt * 1.2; // short hop when released early

  P.dropT -= dt; P.inv -= dt; P.atk -= dt;
  P.abilityCd = Math.max(0, (P.abilityCd || 0) - dt); P.blockT = (P.blockT || 0) - dt; P.blockHitT = (P.blockHitT || 0) - dt; P.castAfter = (P.castAfter || 0) - dt;

  const keep = P.vx, wasGround = P.onGround, fallV = P.vy, prevFeet = P.y + P.h;
  P.phasing = dashing;
  P.vx += P.kb; moveBody(P, dt, P.dropT > 0 || (P.climbing && down('s', 'ArrowDown')), dashing || P.climbing); P.vx = keep;
  if (P.climbing && P.onGround && !down('w', 'ArrowUp', 'k')) P.climbing = false;   // slid down to the ground

  if (P.onGround && P.support !== ONEWAY && isSolidT(tileAt(Math.floor((P.x + 2) / TILE), Math.floor((P.y + P.h + 2) / TILE))) && isSolidT(tileAt(Math.floor((P.x + P.w - 2) / TILE), Math.floor((P.y + P.h + 2) / TILE)))) { P.safeX = P.x; P.safeY = P.y; }

  // interactables

function updateWorld(dt) {

// ---- TALENT TREES (read top to bottom) ----
// Every pet has three trees. Each tree has 5 tiers: tier 1 opens at pet level 1, tier 2 at 5, tier 3 (keystone) at 10,
// tier 4 at 16 and tier 5 at 22 — the ULTIMATE, which teaches the pet a powerful new battle ability.
// A talent needs at least one point in the tier just above it, in the same tree. 1 point per level (29 at level 30).
const PET_MAX_LVL = 30, TIER_LVL = [0, 1, 5, 10, 16, 22];
const nd = (id, name, max, fx, txt) => ({ id, name, max, fx, txt });
const tree = (name, color, tiers) => ({ name, color, tiers });
const upAb = (M, ab, k, v) => { M.up = M.up || {}; const u = M.up[ab] || (M.up[ab] = {}); u[k] = (u[k] || 0) + v; };
const S = (id, name, key, per, txt, max = 3) => typeof key === 'object' ? nd(id, name, txt || 3, key, per) : nd(id, name, max, { [key]: per }, txt);   // S(id, name, {k: v, ...}, txtFn) also works
const UP = (id, name, ab, k, per, txt, max = 3) => nd(id, name, max, (M, r) => upAb(M, ab, k, per * r), txt);
const KEY = (id, name, fx, txt) => nd(id, name, 1, fx, txt);
const ULT = (id, ab) => nd(id, ABIL[ab].n, 1, M => { M.ults = (M.ults || []).concat(ab); }, () => 'ULTIMATE: learns ' + ABIL[ab].n + '. ' + ABIL[ab].d);
const listFx = (key, list) => M => { M[key] = (M[key] || []).concat(list); };

const T_THP = (id, name) => S(id, name, 'teamHp', 0.04, r => `+${4 * r}% max HP for every pet in your team`);
const T_TDEF = (id, name) => S(id, name, 'teamDef', 1, r => `+${r} defense for every pet in your team`);
const T_GUARD = (id, name) => S(id, name, 'guard', 0.08, r => `takes ${8 * r}% of the damage aimed at its allies`);

function update(dt) {

    let msg;

    else if (!SFX.muted) { SFX.toggleMute(); msg = 'All sound off (M)'; }

  }
  musicDirector(dt);
  netTick(dt);
  if (!G) {
    if (SCREEN === 'title') { if (hit('Enter', ' ')) { SFX.play('pick'); enterHub(); } return; }

    const nc = CLASS_ORDER.length;
    if (hit('ArrowLeft', 'a')) selClass = CLASS_ORDER[(i + nc - 1) % nc];

    if (hit('1')) selClass = 'warrior'; if (hit('2')) selClass = 'archer'; if (hit('3')) selClass = 'rogue'; if (hit('4')) selClass = 'beastmaster';
    if (selClass !== before) SFX.play('rotate');

        if (G.panel === 'starter') break;

        if (G.panel === 'net' || G.panel === 'trade') { netPanelKeys(); break; }
        if (G.panel === 'dress') { dressKeys(); break; }
        if (G.panel === 'import') { if (hit('Escape', 'n')) { G.importing = null; G.panel = 'records'; } else if (hit('y')) confirmImport(); break; }
        if (G.panel === 'den' || G.panel === 'trophies' || G.panel === 'newborn') { if (hit('Escape', 'e')) G.panel = null; break; }
        if (!G.panel && hit('w', 'ArrowUp')) { const s = hubNearest(); if (s && s.kind === 'door') { goHubRoom(s.to); break; } }
        if (G.panel === 'acts') { if (hit('Escape')) G.panel = null; else for (let a = 1; a <= actsOpen(); a++) if (hit(String(a))) { startRunFromHub(a); break; } break; }
        if (G.panel === 'team') { if (GIVE && hit('Escape')) { if (GIVE.confirm) { GIVE.confirm = null; GIVE.shinyStep = false; } else GIVE = null; } else if (hit('Escape', 'e')) { G.panel = null; GIVE = null; } if (hit('ArrowDown', 'PageDown')) scrollRoster(112); if (hit('ArrowUp', 'PageUp')) scrollRoster(-112); break; }
        if (hit('Escape')) { if (G.panel) G.panel = null; else { G = null; SCREEN = 'title'; } break; }
        if (hit('p')) { openPause(); break; }
        if (hit('f')) { openNetPanel(); break; }
        if (hit('c') && !G.panel && !G.visit) { openFishBag(); if (G.mode === 'pack') break; }
        if (hit('i', 'b') && !G.panel && !G.visit) { openBag('pantry'); if (G.mode === 'pack') break; }
        if (G.hubRoom === 'yard') updatePond(dt);
        if (G.fish) {   // fishing: the line takes the keys; the world goes on around you
          updateFishing(dt);
          const keep = {}; for (const k of ['a', 'd', 'w', 's', 'e', ' ', 'Shift', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']) { keep[k] = keys[k]; keys[k] = false; pressed[k] = false; }
          updateWorld(dt); Object.assign(keys, keep); break;
        }
        updateWorld(dt); break;
      }
      if (hit('p', 'Escape')) { openPause(); break; }
      if (hit('b', 'i', 'Tab')) { tryOpenPack(); if (G.mode === 'pack') break; }
      if (hit('t')) { openPetsMenu(); break; }
      if (hit('n')) G.minimap = !G.minimap;
      updateWorld(dt);
      break;
    case 'encounter':

      break;
    case 'pause':
      pauseKeys();
      break;
    case 'battle':
      if (B && !B.intro && (hit('p') || (!B.pick && B.phase !== 'won' && B.phase !== 'lost' && hit('Escape')))) { openPause(); break; }

      }
      if (G.msgT > 0) G.msgT -= dt;

    case 'trans':
      G.fade += dt * 3.5 * G.fadeDir;
      if (G.fadeDir > 0 && G.fade >= 1) { G.fade = 1; if (!G.hub) nextRoom(); else if (G.hubTo) { buildHubRoom(G.hubTo.room, G.hubTo.from); G.hubTo = null; } G.fadeDir = -1; }
      else if (G.fadeDir < 0 && G.fade <= 0) { G.fade = 0; G.fadeDir = 0; G.mode = 'play'; }
      updateFx(dt);
      break;
    case 'dead':
      G.deadT += dt; updateFx(dt);
      if (G.deadT > 0.8 && hit('Enter')) enterHub();
      break;
    case 'won':
      G.wonT += dt; updateFx(dt);
      if (G.wonT > 1 && hit('Enter')) { G.endless = true; G.mode = 'trans'; G.fadeDir = 1; G.fade = 0; }
      else if (G.wonT > 1 && hit('Escape')) enterHub();
      break;
  }
}
let last = performance.now();
let dtSmooth = 1 / 60;
function frame(t) {
  const raw = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  // browsers hand out frames a little unevenly: smooth the step so motion glides, but follow real rate changes at once
  dtSmooth += (raw - dtSmooth) * 0.2; if (Math.abs(raw - dtSmooth) > 0.012) dtSmooth = raw;
  // never let one bad frame freeze the whole game: log it and keep going
  VIEW.legacy = VIEW.portrait && !portraitReady();
  if (VIEW.portrait && !VIEW.legacy) { W = 540; H = portraitWorldOnly() ? 540 : VIEW.h; } else { W = 960; H = 540; }   // (portrait: the world's square at the top; other screens use the whole height)
  try { update(Math.min(0.033, dtSmooth)); draw(); } catch (e) { console.error(e); }
  pressed = {};
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
