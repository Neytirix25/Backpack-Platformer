<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backpack Sanctuary</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000;box-shadow:0 0 50px #000}
</style>

<body>
<canvas id="c" width="960" height="540"></canvas>
<!-- animation frame data (generated by tools/animate.py); the game still runs if it's missing -->
<script src="assets/anim/anims.js"></script>
<script>
'use strict';
// =====================================================================
//  BACKPACK SANCTUARY — a side-scrolling roguelike with backpack management
// =====================================================================
const W = 960, H = 540, GRAV = 1500; // W x H = the camera view
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function wpick(entries) {
  let t = 0; for (const e of entries) t += Math.max(0, e[1]);
  let r = Math.random() * t;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const UI = '"Segoe UI",system-ui,sans-serif';
let TIME = 0;

// =====================================================================
//  ART — pixel sprites in ./assets (made with ChatGPT, pixelated by tools/pixelate.py).
//  Anything missing falls back to the original code-drawn graphics.
// =====================================================================
const PX = 2;  // world sprites are drawn at 2x
const ART = {};
const ART_FILES = {
  items: ['pet_fox', 'pet_owl', 'pet_ferret', 'pet_boar', 'pet_toad', 'shortbow', 'greatsword', 'warhammer', 'towershield', 'torc', 'banner', 'breastplate', 'bgauntlet', 'giantbelt', 'lionheart', 'dragonslayer', 'longbow', 'bodkin', 'twinquiver', 'frostarrows', 'blastarrows', 'hawkeye', 'bracer', 'rangercloak', 'fletching', 'starfall', 'venom', 'kris', 'shadowcloak', 'knives', 'lockpicks', 'duelist', 'shadowstep', 'bloodring', 'rmask', 'nightfang', 'barbwhip', 'alphahorn', 'collar', 'totem', 'poultice', 'falconglove', 'whistle', 'wolfcloak', 'bearclaw', 'crown', 'pet_dog', 'pet_catgray', 'pet_catcalico', 'pet_cockatiel', 'pet_dragon', 'wings', 'phoenix', 'treats', 'hourglass', 'lantern', 'dagger', 'arrows', 'sword', 'axe', 'spear', 'bow', 'gloves', 'shield', 'helm', 'chain', 'spiked', 'boots', 'potion', 'bomb', 'bread', 'heart', 'whetstone', 'charm', 'fang', 'clover', 'spikes', 'chewbone', 'clawfile', 'vest', 'blanket', 'incubator', 'harness', 'bell', 'huntmark', 'squeaky', 'catnip', 'cuttlebone', 'heatrock', 'bogmoss', 'truffle', 'nightshade', 'hexcharm', 'healbell', 'dragonheart', 'alphafang', 'salve', 'herb', 'salts', 'brew', 'smoke', 'net', 'egg_cockatiel', 'egg_owl', 'egg_toad', 'egg_dragon', 'egg_elder'],
  chars: ['hero', 'slime', 'bat', 'skeleton', 'archer', 'ghost', 'brute', 'boss'].flatMap(n => [n + '_idle', n + '_attack']),
  props: ['hub_banner_warrior', 'hub_banner_archer', 'hub_banner_rogue', 'hub_banner_beastmaster', 'hub_mirror', 'hub_board', 'hub_petbed', 'barrier', 'cage', 'cage_open', 'plant_bloodberry', 'plant_ember', 'plant_stone', 'plant_swift', 'plant_catnip', 'plant_mandrake', 'chest_secret', 'spikes', 'crumble', 'vent', 'chest_gold', 'chest_closed', 'chest_open', 'campfire', 'torch', 'gate', 'ledge', 'tombstone', 'arrow', 'mushrooms', 'candle', 'bones', 'chain'],
  bg: ['hall', 'cave', 'crypt', 'camp', 'boss', 'forge', 'hollow', 'sanctum', 'hub'],
  anim: Object.keys(window.ANIMS || {}),
  tiles: ['hall', 'cave', 'crypt', 'boss', 'camp', 'forge', 'hollow', 'sanctum'].flatMap(t => [t + '_block', t + '_top', t + '_ledge']),
};
// which animation sheet each character uses
const ANIM_OF = { slime: 'slime', bat: 'bat', skeleton: 'skeleton', archer: 'goblin', ghost: 'ghost', brute: 'brute', boss: 'warden',
                  imp: 'imp', golem: 'golem', cultist: 'cultist', spider: 'spider', knight: 'knight' };
function animFrames(name, anim) { const A = window.ANIMS && window.ANIMS[name]; return (A && art('anim/' + name) && A.anims[anim]) || null; }
function animLen(name, anim) { const f = animFrames(name, anim); return f ? f.length : 0; }
// draw frame i of an animation with its anchor (feet, or body centre for flyers) at (x, y)
function drawAnim(name, anim, i, x, y, face = 1, o = {}) {
  const fr = animFrames(name, anim); if (!fr || !fr.length) return false;
  const img = art('anim/' + name), n = fr.length;
  if (!Number.isFinite(i)) i = 0;   // never crash on a not-yet-started animation clock
  const [fx, fy, fw, fh, ax, ay] = fr[((Math.floor(i) % n) + n) % n];
  const s = o.scale || PX;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(x), Math.round(y));
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(face * (o.sx || 1), o.sy || 1);
  ctx.drawImage(img, fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s);
  if (o.flash) { ctx.globalAlpha *= 0.85; ctx.drawImage(whiteOf(img), fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s); }
  if (o.shadow) ctx.drawImage(blackOf(img), fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s);
  ctx.restore();
  return true;
}
// (legacy) row of each Act I background where its painted floor starts
const BG_FLOOR = { hall: 237, cave: 237, crypt: 237, camp: 237, boss: 237, hub: 230 };
function loadArt(dir, n, tries = 0) {
  const img = new Image();
  img.onload = () => {
    ART[dir + '/' + n] = img;
    try { if (G && G.room && G.room.terrain && dir === 'props') G.room.terrain = bakeTerrain(G.room); } catch (e) { /* game not started yet */ }
  };
  img.onerror = () => { if (tries < 3) setTimeout(() => loadArt(dir, n, tries + 1), 400 * (tries + 1)); };
  img.src = `assets/${dir}/${n}.png` + (tries ? `?r=${tries}` : '');
}
for (const [dir, names] of Object.entries(ART_FILES)) for (const n of names) loadArt(dir, n);
const art = k => ART[k] || null;
const whiteCache = new Map();
const blackCache = new Map();
function blackOf(img) { // solid dark silhouette (pets you haven't rescued yet)
  let c = blackCache.get(img);
  if (!c) {
    c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#0b0a12'; g.fillRect(0, 0, c.width, c.height);
    blackCache.set(img, c);
  }
  return c;
}
function whiteOf(img) { // solid white silhouette for hit flashes
  let c = whiteCache.get(img);
  if (!c) {
    c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    whiteCache.set(img, c);
  }
  return c;
}
// draw a sprite with its bottom-centre at (cx, by); face -1 mirrors it. opts: sx, sy (squash), alpha, flash, rot, scale, center
function drawSprite(img, cx, by, face = 1, o = {}) {
  if (!img) return;
  const C = o.g || ctx;
  const s = (o.scale || PX), w = img.width * s * (o.sx || 1), h = img.height * s * (o.sy || 1);
  C.save();
  C.imageSmoothingEnabled = false;
  if (o.alpha !== undefined) C.globalAlpha *= o.alpha;
  C.translate(Math.round(cx), Math.round(o.center ? by : by - h / 2));
  if (o.rot) C.rotate(o.rot);
  if (face < 0) C.scale(-1, 1);
  C.drawImage(img, -w / 2, -h / 2, w, h);
  if (o.flash) { C.globalAlpha *= 0.85; C.drawImage(whiteOf(img), -w / 2, -h / 2, w, h); }
  C.restore();
}
// keep a character's back edge planted when switching to a wider/narrower pose
function poseX(idle, img, cx, face) { return idle ? cx + face * (img.width - idle.width) * PX / 2 : cx; }

// SAVE SLOTS: every copy of the game keeps its own progress. Chrome gives all pages opened from disk (file://) one
// shared storage, so progress keys are tagged with the folder this copy lives in -> a freshly downloaded copy starts
// fresh. (Sound/music settings stay shared on purpose.)
const SAVE_KEYS = ['packrat_best', 'packrat_coll', 'packrat_records', 'packrat_skin', 'packrat_class', 'packrat_pets', 'packrat_team', 'packrat_ach'];
const SAVE_DIR = (() => { try { return decodeURIComponent(location.pathname).replace(/\\/g, '/').replace(/[^\/]*$/, '').toLowerCase(); } catch (e) { return '/'; } })();
const SLOT = (() => { let h = 2166136261; for (let i = 0; i < SAVE_DIR.length; i++) { h ^= SAVE_DIR.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); })();
function sk(k) { return k + '@' + SLOT; }
// the development folder keeps its progress: 'backpack sanctuary' (renamed from 'pack-rat-dungeon') takes over the old
// folder's save if one sits next to it, otherwise the single shared save from before saves were split per copy
(() => { try {
  const parts = SAVE_DIR.split('/').filter(Boolean), name = parts.pop();
  if (name !== 'pack-rat-dungeon' && name !== 'backpack sanctuary') return;
  if (SAVE_KEYS.some(k => localStorage.getItem(sk(k)) !== null)) return;
  const oldDir = '/' + parts.join('/') + '/pack-rat-dungeon/';
  let h = 2166136261; for (let i = 0; i < oldDir.length; i++) { h ^= oldDir.charCodeAt(i); h = Math.imul(h, 16777619); }
  const oldSlot = (h >>> 0).toString(36), fromOld = name !== 'pack-rat-dungeon' && SAVE_KEYS.some(k => localStorage.getItem(k + '@' + oldSlot) !== null);
  for (const k of SAVE_KEYS) { const v = localStorage.getItem(fromOld ? k + '@' + oldSlot : k); if (v !== null) localStorage.setItem(sk(k), v); }
} catch (e) {} })();
function loadBest() { try { return +localStorage.getItem(sk('packrat_best')) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(sk('packrat_best'), String(v)); } catch (e) {} }
let BEST = loadBest();

// ---------- input ----------
const keys = {}; let pressed = {};
const norm = k => k.length === 1 ? k.toLowerCase() : k;
addEventListener('keydown', e => {
  const k = norm(e.key);
  SFX.init();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[norm(e.key)] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const down = (...ks) => ks.some(k => keys[k]);
const hit = (...ks) => ks.some(k => pressed[k]);

const mouse = { x: 0, y: 0 };
function mpos(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height; }
cv.addEventListener('mousemove', e => {
  mpos(e);
  if (!G && SCREEN === 'class') { const c = classCardAt(mouse); if (c && c !== selClass) { selClass = c; SFX.play('rotate'); } }
});
cv.addEventListener('mousedown', e => { SFX.init(); mpos(e); onMouseDown(e.button); e.preventDefault(); });
addEventListener('mouseup', e => { mpos(e); onMouseUp(e.button); });
cv.addEventListener('contextmenu', e => e.preventDefault());

// =====================================================================
//  SOUND — tiny built-in retro synth (Web Audio). No audio files needed.
// =====================================================================
const SFX = (() => {
  let ac = null, out = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('packrat_muted') === '1'; } catch (e) {}
  const VOL = 0.55, last = {};
  function init() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      out = ac.createGain(); out.gain.value = muted ? 0 : VOL;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
      out.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function env(g, t, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  // pitched blip: square/triangle/sawtooth/sine with a pitch sweep
  function tone({ type = 'square', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, attack = 0.004, delay = 0, vib = 0 }) {
    const t = ac.currentTime + delay, osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib; lg.gain.value = f0 * 0.05; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05); }
    env(g, t, vol, attack, dur);
    osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + dur + 0.05);
  }
  // filtered noise: whooshes, impacts, explosions, rattles
  function noise({ dur = 0.1, vol = 0.2, f0 = 1000, f1 = f0, q = 1, filter = 'bandpass', delay = 0, attack = 0.002 }) {
    const t = ac.currentTime + delay, src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; fl.type = filter; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, vol, attack, dur);
    src.connect(fl); fl.connect(g); g.connect(out); src.start(t, Math.random()); src.stop(t + dur + 0.05);
  }
  const notes = (seq, type, vol, step, len, start = 0) => seq.forEach((f, i) => tone({ type, f0: f, dur: len, vol, delay: start + i * step }));
  const v = () => 0.93 + Math.random() * 0.14; // small random pitch change so repeats don't sound robotic

  const S = {
    // --- player ---
    swing: heavy => { const p = v() * (heavy ? 0.65 : 1); noise({ dur: heavy ? 0.18 : 0.13, vol: 0.22, f0: 450 * p, f1: 2600 * p, q: 1.3, attack: 0.02 }); },
    bow: () => { tone({ type: 'triangle', f0: 1100 * v(), f1: 260, dur: 0.12, vol: 0.16 }); noise({ dur: 0.05, vol: 0.08, f0: 4500, filter: 'highpass' }); },
    jump: () => tone({ type: 'square', f0: 240 * v(), f1: 560, dur: 0.12, vol: 0.08 }),
    land: () => noise({ dur: 0.08, vol: 0.2, f0: 420, f1: 110, filter: 'lowpass' }),
    hit: () => { const p = v(); tone({ type: 'square', f0: 260 * p, f1: 70, dur: 0.08, vol: 0.13 }); noise({ dur: 0.07, vol: 0.24, f0: 2000 * p, f1: 300, filter: 'lowpass' }); },
    crit: () => { S.hit(); tone({ type: 'square', f0: 110, f1: 40, dur: 0.16, vol: 0.14 }); tone({ type: 'triangle', f0: 1500, f1: 2000, dur: 0.14, vol: 0.12, delay: 0.02 }); },
    hurt: () => { tone({ type: 'sawtooth', f0: 420, f1: 110, dur: 0.2, vol: 0.15 }); noise({ dur: 0.12, vol: 0.22, f0: 1300, f1: 200, filter: 'lowpass' }); },
    clank: () => { tone({ type: 'triangle', f0: 1900 * v(), dur: 0.1, vol: 0.1 }); tone({ type: 'square', f0: 2900 * v(), f1: 2600, dur: 0.05, vol: 0.035 }); },
    death: () => { tone({ type: 'sawtooth', f0: 300, f1: 60, dur: 0.5, vol: 0.15 }); notes([440, 370, 311, 247, 196], 'square', 0.1, 0.22, 0.3, 0.35); },
    potion: () => { for (let i = 0; i < 3; i++) tone({ type: 'sine', f0: 260 + i * 90, f1: 440 + i * 90, dur: 0.07, vol: 0.16, delay: i * 0.09 }); notes([784, 988, 1175], 'triangle', 0.1, 0.07, 0.16, 0.3); },
    bomb: () => { noise({ dur: 0.75, vol: 0.55, f0: 2600, f1: 60, filter: 'lowpass', attack: 0.005 }); tone({ type: 'sine', f0: 140, f1: 30, dur: 0.6, vol: 0.4 }); },
    // --- enemies ---
    spawn: () => noise({ dur: 0.2, vol: 0.08, f0: 2200, f1: 400, q: 2 }),
    slimeHop: () => tone({ type: 'sine', f0: 170 * v(), f1: 360, dur: 0.09, vol: 0.06 }),
    ghostAppear: () => tone({ type: 'sine', f0: 240, f1: 620, dur: 0.4, vol: 0.05, vib: 6, attack: 0.12 }),
    rattle: () => { for (let i = 0; i < 3; i++) noise({ dur: 0.03, vol: 0.1, f0: 3000 + Math.random() * 1500, q: 5, delay: i * 0.06 }); },
    enemySwing: () => noise({ dur: 0.15, vol: 0.16, f0: 300, f1: 1500, q: 1.2, attack: 0.02 }),
    enemyBow: () => tone({ type: 'triangle', f0: 700 * v(), f1: 200, dur: 0.13, vol: 0.12 }),
    growl: () => tone({ type: 'sawtooth', f0: 85 * v(), f1: 130, dur: 0.55, vol: 0.13, vib: 14 }),
    thud: () => { tone({ type: 'sine', f0: 120, f1: 40, dur: 0.25, vol: 0.35 }); noise({ dur: 0.15, vol: 0.2, f0: 320, f1: 60, filter: 'lowpass' }); },
    slam: () => { S.thud(); noise({ dur: 0.55, vol: 0.3, f0: 900, f1: 60, filter: 'lowpass' }); },
    summon: () => { tone({ type: 'sine', f0: 300, f1: 900, dur: 0.6, vol: 0.12, vib: 7 }); tone({ type: 'sine', f0: 450, f1: 1350, dur: 0.6, vol: 0.07, vib: 5 }); },
    bossRoar: () => { tone({ type: 'sawtooth', f0: 70, f1: 160, dur: 0.4, vol: 0.22 }); tone({ type: 'sawtooth', f0: 160, f1: 55, dur: 0.7, vol: 0.22, delay: 0.4 }); noise({ dur: 1.0, vol: 0.18, f0: 600, f1: 100, filter: 'lowpass' }); },
    kill_slime: () => { tone({ type: 'sine', f0: 380 * v(), f1: 70, dur: 0.2, vol: 0.25 }); noise({ dur: 0.12, vol: 0.15, f0: 700, f1: 150, filter: 'lowpass' }); },
    kill_bat: () => { tone({ type: 'square', f0: 1800 * v(), f1: 2600, dur: 0.05, vol: 0.07 }); tone({ type: 'square', f0: 2400, f1: 900, dur: 0.12, vol: 0.07, delay: 0.05 }); },
    kill_skeleton: () => { for (let i = 0; i < 5; i++) noise({ dur: 0.04, vol: 0.2, f0: 2500 + Math.random() * 2000, q: 4, delay: i * 0.045 + Math.random() * 0.02 }); },
    kill_archer: () => tone({ type: 'sawtooth', f0: 260 * v(), f1: 90, dur: 0.22, vol: 0.14 }),
    kill_ghost: () => tone({ type: 'triangle', f0: 900 * v(), f1: 180, dur: 0.6, vol: 0.17, vib: 9 }),
    kill_brute: () => { tone({ type: 'sawtooth', f0: 140 * v(), f1: 45, dur: 0.45, vol: 0.2 }); noise({ dur: 0.3, vol: 0.25, f0: 500, f1: 80, filter: 'lowpass' }); },
    dash: () => { noise({ dur: 0.16, vol: 0.2, f0: 900, f1: 3800, q: 1.4, attack: 0.01 }); tone({ type: 'triangle', f0: 300, f1: 700, dur: 0.1, vol: 0.06 }); },
    fireball: () => { noise({ dur: 0.3, vol: 0.18, f0: 600, f1: 2000, q: 0.8, attack: 0.03 }); tone({ type: 'sawtooth', f0: 160, f1: 90, dur: 0.25, vol: 0.06 }); },
    blink: () => { tone({ type: 'sine', f0: 1200, f1: 300, dur: 0.25, vol: 0.1, vib: 20 }); noise({ dur: 0.2, vol: 0.06, f0: 6000, filter: 'highpass' }); },
    block: () => { tone({ type: 'triangle', f0: 2200 * v(), dur: 0.12, vol: 0.14 }); tone({ type: 'square', f0: 3300, f1: 2800, dur: 0.06, vol: 0.05 }); noise({ dur: 0.05, vol: 0.12, f0: 5000, filter: 'highpass' }); },
    flame: () => { noise({ dur: 0.6, vol: 0.2, f0: 300, f1: 1400, q: 0.7, attack: 0.08 }); },
    crumble: () => { noise({ dur: 0.35, vol: 0.22, f0: 800, f1: 120, filter: 'lowpass' }); for (let i = 0; i < 3; i++) noise({ dur: 0.05, vol: 0.12, f0: 1500 + i * 400, q: 3, delay: 0.05 + i * 0.07 }); },
    lava: () => { noise({ dur: 0.4, vol: 0.25, f0: 3000, f1: 600, q: 1, attack: 0.005 }); tone({ type: 'sawtooth', f0: 380, f1: 120, dur: 0.25, vol: 0.12 }); },
    spikes: () => { tone({ type: 'square', f0: 900, f1: 300, dur: 0.12, vol: 0.12 }); noise({ dur: 0.08, vol: 0.18, f0: 4000, filter: 'highpass' }); },
    kill_imp: () => { noise({ dur: 0.4, vol: 0.2, f0: 2500, f1: 300, q: 0.8 }); tone({ type: 'square', f0: 900, f1: 1600, dur: 0.12, vol: 0.06 }); },

  P.landT = (P.landT || 0) - dt; P.hurtT = (P.hurtT || 0) - dt; P.atkAnim = (P.atkAnim || 0) - dt;
  P.kb *= Math.pow(0.003, dt);
  const keep = P.vx, wasGround = P.onGround, fallV = P.vy;
  P.phasing = dashing;
  P.vx += P.kb; moveBody(P, dt, P.dropT > 0, dashing); P.vx = keep;
  // remember the last solid footing, and fall back to it from a chasm
  if (P.onGround && P.support !== ONEWAY && isSolidT(tileAt(Math.floor((P.x + 2) / TILE), Math.floor((P.y + P.h + 2) / TILE))) && isSolidT(tileAt(Math.floor((P.x + P.w - 2) / TILE), Math.floor((P.y + P.h + 2) / TILE)))) { P.safeX = P.x; P.safeY = P.y; }
  if (P.y > R.hpx + 40) fellInChasm();
  for (const sp of R.dashSpots || []) if (!(G.hints && G.hints[sp.kind]) && Math.abs((sp.x0 + sp.x1) / 2 * TILE - (P.x + P.w / 2)) < 280) {
    G.hints = G.hints || {}; G.hints[sp.kind] = true;
    showMsg(sp.kind === 'chasm' ? 'A chasm! Jump, then DASH (Shift) across it.' : 'An arcane barrier! DASH (Shift) straight through it.', 3.2);
  }
  if (dashing && P.hitWall) P.dashT = 0;
  // Winged Boots IV+: hold jump while falling to glide down slowly
  P.gliding = s.glide && !P.onGround && !dashing && P.vy > 90 && down('w', 'ArrowUp', 'k');
  if (P.gliding) {
    P.vy = Math.min(P.vy, 95);
    if (Math.random() < dt * 14) burst(P.x + P.w / 2 + rand(-14, 14), P.y + P.h * 0.4, '#ffffff', 1, 40, 3);
  }
  if (P.onGround) { P.airDashed = false; P.airJumps = s.jumps; }
  if (!wasGround && P.onGround && fallV > 380) SFX.play('land');
  if (!wasGround && P.onGround && fallV > 150) P.landT = 0.1;
  if (Math.abs(P.vx) > 20 && P.onGround) P.walk += dt * Math.abs(P.vx) / 25;
  // crumbling blocks give way a moment after you step on them
  if (P.onGround) { const ty = Math.floor((P.y + P.h + 1) / TILE); for (let tx = Math.floor((P.x + 2) / TILE); tx <= Math.floor((P.x + P.w - 2) / TILE); tx++) startCrumble(tx, ty); }
  checkPlayerHazards();
  if (P.y > R.hpx + 100) { P.x = R.entry.x - P.w / 2; P.y = R.entry.y - P.h; P.vy = 0; } // safety net

  // exit
  if (G.hub) { if (G.mode === 'play' && overlap(P, exitRect(R))) { startRunFromHub(); if (G.hub) { P.x -= 40; } return; } if (G.panel === 'records' && Math.abs(P.vx) > 40) G.panel = null; }
  else if (G.mode === 'play' && overlap(P, exitRect(R)) && exitOpen()) {
    if (R.n >= FINAL_FLOOR && !G.endless) {
      G.mode = 'won'; G.wonT = 0; SFX.play('kill_boss'); logRun(true);
      if (G.roomNum > BEST) { BEST = G.roomNum; saveBest(BEST); }
      return;
    }
    G.mode = 'trans'; G.fadeDir = 1; G.fade = 0; SFX.play('door'); return;
  }

  if (hit('e') && G.hub) hubInteract();
  if (!G.hub && G.mode === 'play' && overlap(P, exitRect(R)) && !exitOpen() && !(G.exitHintT > 0)) {
    G.exitHintT = 2.5; const left = exitNeed() - G.wild.filter(w => w.beaten).length;
    showMsg(`The way down is blocked: win ${left} more battle${left > 1 ? 's' : ''} on this floor.`, 2.2);
  }
  G.exitHintT = (G.exitHintT || 0) - dt;

  // interactables
  for (const pl of R.plants || []) if (!pl.taken && plantVisible(pl) && overlap(P, { x: pl.x - 14, y: pl.y - 30, w: 28, h: 30 })) pickPlant(pl);
  for (const C of R.chests) {
    if (!plantVisible(C)) continue;
    if (!C.seen && inView(C.x, C.y, 0)) C.seen = true;
    if (!C.open && overlap(P, C)) {
      C.open = true;
      const it = makeItem(chestLoot(C, R));
      burst(C.x + C.w / 2, C.y, RARITY[it.def.rarity].c, 24, 260);
      SFX.play('chest', it.def.rarity === 'rare');
      openPack([it]);
      if (C.secret) showMsg(`Secret stash: ${it.def.name}!`, 2.8); else if (C.bonus) showMsg(`Hidden treasure: ${it.def.name}!`, 2.5);
      break;
    }
  }
  if (R.fire && !R.fire.used && !R.fire.hub && overlap(P, R.fire)) {
    R.fire.used = true; for (const it of petSlots) if (it) RUN.petHp[it.def.pet] = 1; syncPets(); SFX.play('rest');
    showMsg('You rest by the fire: every pet is fully healed (even fainted ones).', 2.5);
  }
}





function updateWorld(dt) {
  const R = G.room;
  updatePlayer(dt);
  if (G.mode !== 'play' && G.mode !== 'pack') { updateFx(dt); return; }
  if (exitOpen()) R.openT += dt;
  updateHazards(dt);
  R.navT = (R.navT || 0) - dt;
  if (R.navT <= 0) { updateNavFields(); R.navT = 0.3; }
  updateWild(dt);
  updatePets(dt);
  for (const p of G.pets || []) steadyFace(p, dt, 0.15);
  updateBuffs(dt);
  updateFx(dt);
  updateCamera(dt);
}

// ---- TALENT TREES (read top to bottom) ----
// Every pet has three trees. Each tree has 5 tiers: tier 1 opens at pet level 1, tier 2 at 5, tier 3 (keystone) at 10,
// tier 4 at 16 and tier 5 at 22 — the ULTIMATE, which teaches the pet a powerful new battle ability.
// A talent needs at least one point in the tier just above it, in the same tree. 1 point per level (29 at level 30).
const PET_MAX_LVL = 30, TIER_LVL = [0, 1, 5, 10, 16, 22];
const nd = (id, name, max, fx, txt) => ({ id, name, max, fx, txt });
const tree = (name, color, tiers) => ({ name, color, tiers });
const upAb = (M, ab, k, v) => { M.up = M.up || {}; const u = M.up[ab] || (M.up[ab] = {}); u[k] = (u[k] || 0) + v; };
const S = (id, name, key, per, txt, max = 3) => typeof key === 'object' ? nd(id, name, txt || 3, key, per) : nd(id, name, max, { [key]: per }, txt);   // S(id, name, {k: v, ...}, txtFn) also works
const UP = (id, name, ab, k, per, txt, max = 3) => nd(id, name, max, (M, r) => upAb(M, ab, k, per * r), txt);
const KEY = (id, name, fx, txt) => nd(id, name, 1, fx, txt);
const ULT = (id, ab) => nd(id, ABIL[ab].n, 1, M => { M.ults = (M.ults || []).concat(ab); }, () => 'ULTIMATE: learns ' + ABIL[ab].n + '. ' + ABIL[ab].d);
const listFx = (key, list) => M => { M[key] = (M[key] || []).concat(list); };
// common talents
const T_HP = (id, name) => S(id, name, 'hp', 0.12, r => `+${12 * r}% max HP`);
const T_ATK = (id, name) => S(id, name, 'atk', 0.1, r => `+${10 * r}% attack`);
const T_CRIT = (id, name) => S(id, name, 'crit', 0.07, r => `+${7 * r}% critical hit chance`);
const T_CMUL = (id, name) => S(id, name, 'critMul', 0.25, r => `its crits deal +${25 * r}% more`);
const T_DODGE = (id, name) => S(id, name, 'evade', 0.06, r => `${6 * r}% chance to dodge attacks`);
const T_BLEED = (id, name) => S(id, name, 'bleedOn', 0.1, r => `damaging hits make foes Bleed (${10 * r}% of its attack per turn)`);
const T_DOUBLE = (id, name) => S(id, name, 'double', 0.08, r => `${8 * r}% chance to strike a single foe twice`);
const T_FIRST = (id, name) => S(id, name, 'firstStrike', 0.2, r => `+${20 * r}% damage on the first turn of a battle`);
const T_THORNS = (id, name) => S(id, name, 'thorns', 0.12, r => `attackers take ${12 * r}% of the damage back`);
const T_REGEN = (id, name) => S(id, name, 'regen', 0.02, r => `regenerates ${2 * r}% max HP every turn`);

const T_EXEC = (id, name) => S(id, name, 'execute', 0.05, r => `finishes off normal foes below ${5 * r}% HP`);

const T_TATK = (id, name) => S(id, name, 'teamAtk', 0.03, r => `+${3 * r}% attack for every pet in your team`);
const T_TCRIT = (id, name) => S(id, name, 'teamCrit', 0.03, r => `+${3 * r}% crit for every pet in your team`);
const T_THP = (id, name) => S(id, name, 'teamHp', 0.04, r => `+${4 * r}% max HP for every pet in your team`);
const T_TDEF = (id, name) => S(id, name, 'teamDef', 1, r => `+${r} defense for every pet in your team`);
const T_GUARD = (id, name) => S(id, name, 'guard', 0.08, r => `takes ${8 * r}% of the damage aimed at its allies`);
const T_STUN = (id, name) => S(id, name, 'stunCh', 0.05, r => `${5 * r}% chance for its hits to stun`);
const T_CD = (id, name, ab) => UP(id, name, ab, 'cd', 1, r => `${ABIL[ab].n} is ready ${r} turn${r > 1 ? 's' : ''} sooner`, 1);
const T_TURNS = (id, name, ab, max = 2) => UP(id, name, ab, 'turns', 1, r => `${ABIL[ab].n}'s effects last +${r} turn${r > 1 ? 's' : ''}`, max);

    ctx.font = `bold 11px ${UI}`; ctx.fillStyle = syn(x.id) ? '#ffd54f' : '#9e9e9e';
    ctx.fillText(`${x.icon} ${x.name} (+ ${partner})${syn(x.id) ? ' ✓' : ''}`, lx + 10, sy); sy += 13;
    ctx.font = `10px ${UI}`; ctx.fillStyle = syn(x.id) ? '#e0e0e0' : '#8a8a8a'; sy = wrap(x.txt, lx + 10, sy, lw - 20, 12) + 4;
  }
  if (G.msgT > 0 && G.msg) {   // feedback for the last click (learned, locked, reset...)
    ctx.globalAlpha = Math.min(1, G.msgT * 2); ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(lx + 4, TAL_RESET.y - 62, lw - 8, 54, 8); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = `bold 11px ${UI}`; ctx.fillStyle = '#ffe082';
    const words = G.msg.split(' '), lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > lw - 20 && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur);
    lines.slice(0, 4).forEach((l, i) => ctx.fillText(l, lx + lw / 2, TAL_RESET.y - 35 + (i - (Math.min(4, lines.length) - 1) / 2) * 12));
    ctx.globalAlpha = 1;
  }
  for (const [b, label, col] of [[TAL_RESET, 'Reset talents (free)', '#8d6e63'], [TAL_CLOSE, 'Back  [B]', '#43a047']]) {
    const over = inRect(mouse, b);
    ctx.fillStyle = over ? (b === TAL_CLOSE ? '#66bb6a' : '#a1887f') : col; rr(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = `bold 13px ${UI}`; ctx.fillStyle = '#fff'; ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
  // ---- right: three trees ----
  const rects = talentRects(it); let hov = null;
  trees.forEach((tr, ti) => {
    const x0 = TREE_X + ti * (TREE_W + TREE_GAP), spent = tr.tiers.flat().reduce((a, n) => a + tal(it, n.id), 0);
    ctx.fillStyle = 'rgba(255,255,255,0.035)'; rr(x0, TAL.y + 12, TREE_W, 382, 10); ctx.fill();
    ctx.fillStyle = tr.color; ctx.fillRect(x0 + 10, TAL.y + 50, TREE_W - 20, 2);
    ctx.textAlign = 'center'; ctx.font = `bold 16px ${UI}`; ctx.fillStyle = tr.color; ctx.fillText(tr.name, x0 + TREE_W / 2, TAL.y + 30);
    ctx.font = `11px ${UI}`; ctx.fillStyle = spent ? '#e0e0e0' : '#8a8a8a'; ctx.fillText(`${spent} point${spent === 1 ? '' : 's'} spent`, x0 + TREE_W / 2, TAL.y + 64);
    tr.tiers.forEach((row, k) => {   // level labels down the side
      const open = L >= TIER_LVL[k + 1];
      ctx.textAlign = 'left'; ctx.font = `bold 10px ${UI}`; ctx.fillStyle = open ? '#c8e6c9' : '#6d6d6d';
      ctx.fillText(k === 4 ? 'ULT' : `T${k + 1}`, x0 + 8, ROW_Y + k * ROW_H + 15);
      ctx.font = `9.5px ${UI}`; ctx.fillText(`Lv ${TIER_LVL[k + 1]}`, x0 + 8, ROW_Y + k * ROW_H + 29);
    });
    // lines from each tier down to the next
    for (let k = 1; k < tr.tiers.length; k++) for (const a of rects.filter(r => r.ti === ti && r.tier === k)) for (const b of rects.filter(r => r.ti === ti && r.tier === k + 1)) {
      const lit = tal(it, a.t.id) > 0 && tal(it, b.t.id) > 0, ready = tal(it, a.t.id) > 0;
      ctx.strokeStyle = lit ? '#ffd54f' : ready ? 'rgba(165,214,167,0.55)' : 'rgba(255,255,255,0.1)'; ctx.lineWidth = lit ? 2.5 : 1.5;
      ctx.beginPath(); ctx.moveTo(a.x + a.w / 2, a.y + a.h); ctx.lineTo(b.x + b.w / 2, b.y); ctx.stroke();
    }
  });
  for (const r of rects) {
    const t = r.t, rank = tal(it, t.id), open = L >= TIER_LVL[r.tier], can = canLearn(it, t), over = inRect(mouse, r), ult = r.tier === 5, col = trees[r.ti].color;
    if (over) hov = r;
    ctx.fillStyle = rank >= t.max ? 'rgba(255,213,79,0.16)' : rank > 0 ? 'rgba(255,213,79,0.08)' : can ? `rgba(129,199,132,${over ? 0.3 : 0.16})` : open ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.025)';
    rr(r.x, r.y, r.w, r.h, ult ? 12 : 8); ctx.fill();
    ctx.strokeStyle = rank > 0 ? '#ffd54f' : can ? '#81c784' : over ? 'rgba(255,255,255,0.5)' : ult && open ? col : 'rgba(255,255,255,0.13)';
    ctx.lineWidth = rank > 0 || can || ult ? 2 : 1; ctx.stroke();
    ctx.textAlign = 'center'; ctx.font = `bold ${r.w < 100 ? 10.5 : 11.5}px ${UI}`; ctx.fillStyle = !open ? '#6d6d6d' : rank > 0 ? '#ffe082' : '#fff';
    const name = (ult ? '★ ' : '') + t.name;
    if (ctx.measureText(name).width > r.w - 10) { const ws = name.split(' '), h = Math.ceil(ws.length / 2); ctx.fillText(ws.slice(0, h).join(' '), r.x + r.w / 2, r.y + 11); ctx.fillText(ws.slice(h).join(' '), r.x + r.w / 2, r.y + 24); }
    else ctx.fillText(name, r.x + r.w / 2, r.y + 16);
    for (let q = 0; q < t.max; q++) { ctx.fillStyle = q < rank ? '#ffd54f' : 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(r.x + r.w / 2 + (q - (t.max - 1) / 2) * 11, r.y + r.h - 8, 3.5, 0, 7); ctx.fill(); }
  }
  // ---- details of the talent under the mouse ----
  const DX = TREE_X, DY = TAL.y + 402, DW = TAL.w - (TREE_X - TAL.x) - 12, DH = TAL.h - 414;
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; rr(DX, DY, DW, DH, 10); ctx.fill();
  ctx.textAlign = 'left';
  if (hov) {
    const t = hov.t, rank = tal(it, t.id), why = talentBlock(it, t), cap = s => s.charAt(0).toUpperCase() + s.slice(1) + '.';
    ctx.font = `bold 14px ${UI}`; ctx.fillStyle = trees[hov.ti].color;
    ctx.fillText(`${hov.tier === 5 ? '★ ' : ''}${t.name}`, DX + 12, DY + 16);
    ctx.font = `11px ${UI}`; ctx.fillStyle = '#9e9e9e'; ctx.textAlign = 'right';
    ctx.fillText(`${trees[hov.ti].name} · ${hov.tier === 5 ? 'Ultimate' : hov.tier === 3 ? 'Keystone' : 'Tier ' + hov.tier} · rank ${rank}/${t.max}`, DX + DW - 12, DY + 16);
    ctx.textAlign = 'right'; ctx.font = `bold 11.5px ${UI}`; ctx.fillStyle = rank >= t.max ? '#ffd54f' : why ? '#ef9a9a' : '#a5d6a7';
    ctx.fillText(why || 'Click to learn.', DX + DW - 12, DY + 34);
    ctx.textAlign = 'left'; ctx.font = `12px ${UI}`; ctx.fillStyle = '#e0e0e0';
    const ultAb = hov.tier === 5 && BS[it.def.pet].ult[hov.ti];
    if (ultAb) {   // ultimates: the full breakdown of the ability it teaches
      const lines = [ABIL[ultAb].d].concat(abilityLines(null, ultAb).slice(0, -1)).join(' ');
      wrap('ULTIMATE: learns ' + ABIL[ultAb].n + '. ' + lines + ' ' + abilityLines(null, ultAb).slice(-1)[0], DX + 12, DY + 52, DW - 24, 14);
    } else {
      let y = wrap((rank ? 'Now: ' : '') + cap(t.txt(Math.max(1, rank))), DX + 12, DY + 52, DW - 24, 14);
      if (rank && rank < t.max) { ctx.fillStyle = '#c5e1a5'; wrap('Next rank: ' + cap(t.txt(rank + 1)), DX + 12, y + 2, DW - 24, 14); }
    }
  } else {
    ctx.font = `12.5px ${UI}`; ctx.fillStyle = '#bdbdbd';
    wrap('Spend points from the top of a tree down. Each tier opens at the level on the left and needs a point in the tier above it. Mix trees or go deep for the ultimates; reset any time for free.', DX + 12, DY + 22, DW - 24, 16);
  }
}

function drawTitle() {
  ctx.fillStyle = '#14141c'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, 220, 20, W / 2, 220, 460); g.addColorStop(0, '#3a2a1a'); g.addColorStop(1, '#0b0b10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawTorch(150, 150); drawTorch(W - 150, 150);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tc = art('props/chest_open');
  if (tc) drawSprite(tc, W / 2, 126, 1, { scale: 4 }); else { ctx.font = `64px ${EMOJI}`; ctx.fillText('🎒', W / 2, 96); }
  // hero vs. the Warden
  const th = art('chars/hero_idle'), tb = art('chars/boss_idle');
  if (!drawAnim(heroSheet(selClass), 'idle', TIME * 5, 150, 440, 1, { scale: 5 }) && th) drawSprite(th, 150, 440 + Math.round(Math.sin(TIME * 2) * 2), 1, { scale: 5 });
  if (!drawAnim('warden', 'idle', TIME * 4, W - 150, 440, -1, { scale: 3 }) && tb) drawSprite(tb, W - 150, 440, -1, { scale: 3 });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 54px ${UI}`; ctx.fillStyle = '#ffe0b2'; ctx.fillText('BACKPACK SANCTUARY', W / 2, 168);
  ctx.font = `16px ${UI}`; ctx.fillStyle = '#bcaaa4'; ctx.fillText('Fight through rooms. Loot everything. Pack it well — your backpack IS your build.', W / 2, 212);
  const lines = [['A / D  or  ← →', 'Move'], ['W / ↑', 'Jump  (S / ↓ drops through platforms)'], ['Space (hold)', 'Attack'], ['Q', 'Drink a Health Potion'], ['E', 'Class ability  (in the Sanctuary: use / pet)'], ['B / Tab', 'Open backpack (when the room is clear)'], ['Shift / L', 'Dash (you can\'t be hurt mid-dash)'], ['N', 'Show / hide the minimap'], ['P / Esc', 'Pause'], ['M', 'Mute / unmute sound']];
  lines.forEach(([k, v], i) => {
    const y = 246 + i * 21;
    ctx.textAlign = 'right'; ctx.font = `bold 15px ${UI}`; ctx.fillStyle = '#ffcc80'; ctx.fillText(k, W / 2 - 14, y);
    ctx.textAlign = 'left'; ctx.font = `15px ${UI}`; ctx.fillStyle = '#e0e0e0'; ctx.fillText(v, W / 2 + 14, y);
  });
  const a = 0.6 + 0.4 * Math.sin(TIME * 4);
  ctx.textAlign = 'center'; ctx.font = `bold 22px ${UI}`; ctx.fillStyle = `rgba(105,240,174,${a})`; ctx.fillText('Press Enter or click to begin', W / 2, 466);
  if (BEST) { ctx.font = `14px ${UI}`; ctx.fillStyle = '#9e9e9e'; ctx.fillText(`Deepest floor reached: ${BEST}`, W / 2, 500); }
}

function drawClassSelect() {
  const g = ctx.createRadialGradient(W / 2, 240, 20, W / 2, 240, 520); g.addColorStop(0, '#2e2216'); g.addColorStop(1, '#0b0b10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawTorch(150, 52); drawTorch(W - 150, 52);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 34px ${UI}`; ctx.fillStyle = '#ffe0b2'; ctx.fillText('Choose your class', W / 2, 50);
  ctx.font = `14px ${UI}`; ctx.fillStyle = '#a1887f'; ctx.fillText('← / → or 1-4 to choose · Enter or click to begin · Esc to go back', W / 2, 84);
  const hero = art('chars/hero_idle');
  CLASS_ORDER.forEach((cls, i) => {
    const C = CLASSES[cls], R = classCardRect(i), sel = cls === selClass, lift = sel ? -6 : 0;
    const x = R.x, y = R.y + lift;
    ctx.save();
    if (sel) { ctx.shadowColor = C.color; ctx.shadowBlur = 24; }
    ctx.fillStyle = sel ? 'rgba(40,30,24,0.95)' : 'rgba(24,20,18,0.85)'; rr(x, y, R.w, R.h, 12); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = sel ? C.color : 'rgba(255,255,255,0.12)'; ctx.lineWidth = sel ? 3 : 1.5; rr(x, y, R.w, R.h, 12); ctx.stroke();
    ctx.font = `bold 13px ${UI}`; ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.textAlign = 'left'; ctx.fillText(String(i + 1), x + 12, y + 16);
    ctx.textAlign = 'center'; ctx.font = `bold 24px ${UI}`; ctx.fillStyle = C.color; ctx.fillText(C.name, x + R.w / 2, y + 30);
    // selected class runs, the others breathe
    if (!drawAnim(cls, sel ? 'run' : 'idle', TIME * (sel ? 9 : 5), x + R.w / 2, y + 128, 1, { scale: 3 }) && hero)
      drawSprite(hero, x + R.w / 2, y + 128 + (sel ? Math.round(Math.sin(TIME * 3) * 2) : 0), 1, { scale: 3 });
    // starting kit, shown in a little backpack
    const P = CLASS_PREVIEW[cls], cs = 26, gcols = 4, grows = 3, gx = x + (R.w - gcols * cs) / 2, gy = y + 140;
    ctx.fillStyle = '#5a3b22'; rr(gx - 6, gy - 6, gcols * cs + 12, grows * cs + 12, 6); ctx.fill();
    for (let r = 0; r < grows; r++) for (let c = 0; c < gcols; c++) { ctx.fillStyle = (r + c) % 2 ? '#35251a' : '#3a291d'; ctx.fillRect(gx + c * cs + 1, gy + r * cs + 1, cs - 2, cs - 2); }
    for (const it of P.items) drawItem(it, gx + it.x * cs, gy + it.y * cs, cs);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `12px ${UI}`; ctx.fillStyle = '#cfcfcf';
    ctx.fillText(P.items.map(it => it.def.name).join(' + '), x + R.w / 2, y + 238);
    const s = P.stats;
    ctx.font = `bold 13px ${UI}`; ctx.fillStyle = '#ffe0b2';
    ctx.fillText(`⚔ ${s.dmg} dmg   ⏱ ${(1 / s.attackCd).toFixed(1)}/s${cls === 'archer' ? '   🏹 ranged' : cls === 'beastmaster' ? '   🐾 pets +1' : s.bow ? '   🏹 arrows' : ''}${s.potions ? '   🧪 ' + s.potions : ''}`, x + R.w / 2, y + 258);
    ctx.font = `12.5px ${UI}`; ctx.fillStyle = '#bdbdbd';
    wrap(C.blurb, x + R.w / 2, y + 282, R.w - 30, 16);
  });
  const C = CLASSES[selClass], a = 0.6 + 0.4 * Math.sin(TIME * 4);
  ctx.textAlign = 'center'; ctx.font = `bold 20px ${UI}`; ctx.fillStyle = `rgba(105,240,174,${a})`;
  ctx.fillText(`Press Enter to descend as the ${C.name}`, W / 2, 476);
  if (BEST) { ctx.font = `13px ${UI}`; ctx.fillStyle = '#8d8d8d'; ctx.fillText(`Deepest floor reached: ${BEST}`, W / 2, 508); }
}

function drawOverlay(title, sub, sub2) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 48px ${UI}`; ctx.fillStyle = '#fff'; ctx.fillText(title, W / 2, H / 2 - 50);
  ctx.font = `18px ${UI}`; ctx.fillStyle = '#e0e0e0'; ctx.fillText(sub, W / 2, H / 2 + 4);
  if (sub2) { ctx.font = `bold 18px ${UI}`; ctx.fillStyle = '#69f0ae'; ctx.fillText(sub2, W / 2, H / 2 + 48); }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (!G) { if (SCREEN === 'class') drawClassSelect(); else drawTitle(); return; }
  if (G.mode === 'battle' && B) { drawBattle(); return; }
  ctx.save();
  const shk = G.shake > 0.5 && G.mode === 'play' ? G.shake * 0.8 : 0;
  drawParallax(G.room);
  // snap the camera relative to the hero, so the hero never wobbles a pixel against the screen while running
  const Pp = G.player, camX = Math.round(Pp.x) - Math.round(Pp.x - G.cam.x), camY = Math.round(Pp.y) - Math.round(Pp.y - G.cam.y);
  ctx.translate(-camX + Math.round(Math.sin(TIME * 63) * shk), -camY + Math.round(Math.cos(TIME * 51) * shk));  // camera follows the player
  drawTerrain(G.room);
  drawWorldDynamic(G.room);
  if (G.hub) drawHubWorld();
  drawWild();
  drawPets();
  drawPlayer();
  drawFx();
  if (G.hub) drawHubBubble();
  ctx.restore();
  drawVignette();
  if (G.mode === 'pack') { drawPack(); drawHUDMessageOnly(); return; }
  if (G.hub) drawHubHUD(); else drawHUD();
  if (G.mode === 'trans' || G.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(G.fade, 0, 1)})`; ctx.fillRect(0, 0, W, H); }
  if (G.mode === 'pause') drawOverlay('Paused', 'Press P or Esc to resume');
  if (G.mode === 'won') drawOverlay('VICTORY!', `The ${CLASSES[G.cls].name} and their pets conquered all ${FINAL_FLOOR} floors · ${G.battlesWon || 0} battles won`, G.wonT > 1 ? 'Enter: keep descending (endless)  ·  Esc: back to the Sanctuary' : '');
  if (G.mode === 'dead' && G.deadT > 0.5) drawOverlay('Your team fainted', `Floor ${G.roomNum} · ${G.battlesWon || 0} battles won · your pets keep every level they earned${G.newBest ? ' · NEW BEST!' : ''}`, G.deadT > 0.8 ? 'Press Enter or click to return to the Sanctuary' : '');
}
function drawHUDMessageOnly() {
  if (PK && (PK.talent != null || PK.roster)) return;   // the talent and team screens cover the middle of the screen
  if (G.msgT > 0 && G.msg) {
    ctx.globalAlpha = Math.min(1, G.msgT * 2);
    ctx.font = `bold 16px ${UI}`; const tw = ctx.measureText(G.msg).width + 32;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; rr(W / 2 - tw / 2, 50, tw, 30, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(G.msg, W / 2, 65);
    ctx.globalAlpha = 1;
  }
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
function update(dt) {
  TIME += dt;
  if (hit('m')) {
    let msg;
    if (!SFX.muted && Music.on) { Music.setOn(false); msg = 'Music off (M)'; }
    else if (!SFX.muted) { SFX.toggleMute(); msg = 'All sound off (M)'; }
    else { SFX.toggleMute(); Music.setOn(true); msg = 'Sound and music on (M)'; }
    if (G) showMsg(msg, 1.2);
  }
  musicDirector(dt);
  if (!G) {
    if (SCREEN === 'title') { if (hit('Enter', ' ')) { SFX.play('pick'); enterHub(); } return; }
    const i = CLASS_ORDER.indexOf(selClass), before = selClass;
    const nc = CLASS_ORDER.length;
    if (hit('ArrowLeft', 'a')) selClass = CLASS_ORDER[(i + nc - 1) % nc];
    if (hit('ArrowRight', 'd')) selClass = CLASS_ORDER[(i + 1) % nc];
    if (hit('1')) selClass = 'warrior'; if (hit('2')) selClass = 'archer'; if (hit('3')) selClass = 'rogue'; if (hit('4')) selClass = 'beastmaster';
    if (selClass !== before) SFX.play('rotate');
    if (hit('Escape')) SCREEN = 'title';
    else if (hit('Enter', ' ')) newGame(selClass);
    return;
  }
  switch (G.mode) {
    case 'play':
      if (G.hub) {
        G.gateHintT = (G.gateHintT || 0) - dt;
        if (PK && PK.talent != null) { if (hit('Escape', 'b')) PK = null; break; }
        if (G.panel === 'starter') break;
        if (G.panel === 'team') { if (hit('Escape', 'e')) G.panel = null; break; }
        if (hit('Escape')) { if (G.panel) G.panel = null; else { G = null; SCREEN = 'title'; } break; }
        if (hit('p')) { G.mode = 'pause'; SFX.play('pause'); break; }
        updateWorld(dt); break;
      }
      if (hit('p', 'Escape')) { G.mode = 'pause'; SFX.play('pause'); break; }
      if (hit('b', 'i', 'Tab')) { tryOpenPack(); if (G.mode === 'pack') break; }
      if (hit('t')) { openPetsMenu(); break; }
      if (hit('n')) G.minimap = !G.minimap;
      updateWorld(dt);
      break;
    case 'pause':
      if (hit('p', 'Escape')) { G.mode = 'play'; SFX.play('pause'); }
      break;
    case 'battle':
      if (B) updateBattle(dt); else G.mode = 'play';
      break;
    case 'pack':
      if (PK && PK.flash) PK.flash.t -= dt;
      if (PK && PK.talent != null) { if (hit('b', 'i', 'Tab', 'Escape')) PK.talent = null; }
      else if (PK && PK.roster) { if (hit('b', 'i', 'Tab', 'Escape', 't')) closeRoster(); }
      else {
        if (hit('r')) { if (PK.drag) rotateDrag(); else rotateHovered(); }
        if (hit('b', 'i', 'Tab', 'Escape')) closePack();
      }
      if (G.msgT > 0) G.msgT -= dt;
      break;
    case 'trans':
      G.fade += dt * 3.5 * G.fadeDir;
      if (G.fadeDir > 0 && G.fade >= 1) { G.fade = 1; if (!G.hub) nextRoom(); G.fadeDir = -1; }
      else if (G.fadeDir < 0 && G.fade <= 0) { G.fade = 0; G.fadeDir = 0; G.mode = 'play'; }
      updateFx(dt);
      break;
    case 'dead':
      G.deadT += dt; updateFx(dt);
      if (G.deadT > 0.8 && hit('Enter')) enterHub();
      break;
    case 'won':
      G.wonT += dt; updateFx(dt);
      if (G.wonT > 1 && hit('Enter')) { G.endless = true; G.mode = 'trans'; G.fadeDir = 1; G.fade = 0; }
      else if (G.wonT > 1 && hit('Escape')) enterHub();
      break;
  }
}
let last = performance.now();
let dtSmooth = 1 / 60;
function frame(t) {
  const raw = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  // browsers hand out frames a little unevenly: smooth the step so motion glides, but follow real rate changes at once
  dtSmooth += (raw - dtSmooth) * 0.2; if (Math.abs(raw - dtSmooth) > 0.012) dtSmooth = raw;
  // never let one bad frame freeze the whole game: log it and keep going
  try { update(Math.min(0.033, dtSmooth)); draw(); } catch (e) { console.error(e); }
  pressed = {};
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
