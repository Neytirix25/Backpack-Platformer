<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pack Rat Dungeon</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000;box-shadow:0 0 50px #000}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<!-- animation frame data (generated by tools/animate.py); the game still runs if it's missing -->
<script src="assets/anim/anims.js"></script>
<script>
'use strict';
// =====================================================================
//  PACK RAT DUNGEON — a side-scrolling roguelike with backpack management
// =====================================================================
const W = 960, H = 540, GRAV = 1500; // W x H = the camera view
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function wpick(entries) {
  let t = 0; for (const e of entries) t += Math.max(0, e[1]);
  let r = Math.random() * t;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const UI = '"Segoe UI",system-ui,sans-serif';
let TIME = 0;

// =====================================================================
//  ART — pixel sprites in ./assets (made with ChatGPT, pixelated by tools/pixelate.py).
//  Anything missing falls back to the original code-drawn graphics.
// =====================================================================
const PX = 2;  // world sprites are drawn at 2x
const ART = {};
const ART_FILES = {
  items: ['shortbow', 'greatsword', 'warhammer', 'towershield', 'torc', 'banner', 'breastplate', 'bgauntlet', 'giantbelt', 'lionheart', 'dragonslayer', 'longbow', 'bodkin', 'twinquiver', 'frostarrows', 'blastarrows', 'hawkeye', 'bracer', 'rangercloak', 'fletching', 'starfall', 'venom', 'kris', 'shadowcloak', 'knives', 'lockpicks', 'duelist', 'shadowstep', 'bloodring', 'rmask', 'nightfang', 'barbwhip', 'alphahorn', 'collar', 'totem', 'poultice', 'falconglove', 'whistle', 'wolfcloak', 'bearclaw', 'crown', 'pet_dog', 'pet_catgray', 'pet_catcalico', 'pet_cockatiel', 'pet_dragon', 'wings', 'phoenix', 'treats', 'hourglass', 'lantern', 'dagger', 'arrows', 'sword', 'axe', 'spear', 'bow', 'gloves', 'shield', 'helm', 'chain', 'spiked', 'boots', 'potion', 'bomb', 'bread', 'heart', 'whetstone', 'charm', 'fang', 'clover'],
  chars: ['hero', 'slime', 'bat', 'skeleton', 'archer', 'ghost', 'brute', 'boss'].flatMap(n => [n + '_idle', n + '_attack']),
  props: ['plant_bloodberry', 'plant_ember', 'plant_stone', 'plant_swift', 'plant_catnip', 'plant_mandrake', 'chest_secret', 'spikes', 'crumble', 'vent', 'chest_gold', 'chest_closed', 'chest_open', 'campfire', 'torch', 'gate', 'ledge', 'tombstone', 'arrow', 'mushrooms', 'candle', 'bones', 'chain'],
  bg: ['hall', 'cave', 'crypt', 'camp', 'boss', 'forge', 'hollow', 'sanctum'],
  anim: Object.keys(window.ANIMS || {}),
  tiles: ['hall', 'cave', 'crypt', 'boss', 'camp', 'forge', 'hollow', 'sanctum'].flatMap(t => [t + '_block', t + '_top', t + '_ledge']),
};
// which animation sheet each character uses
const ANIM_OF = { slime: 'slime', bat: 'bat', skeleton: 'skeleton', archer: 'goblin', ghost: 'ghost', brute: 'brute', boss: 'warden',
                  imp: 'imp', golem: 'golem', cultist: 'cultist', spider: 'spider', knight: 'knight' };
function animFrames(name, anim) { const A = window.ANIMS && window.ANIMS[name]; return (A && art('anim/' + name) && A.anims[anim]) || null; }
function animLen(name, anim) { const f = animFrames(name, anim); return f ? f.length : 0; }
// draw frame i of an animation with its anchor (feet, or body centre for flyers) at (x, y)
function drawAnim(name, anim, i, x, y, face = 1, o = {}) {
  const fr = animFrames(name, anim); if (!fr || !fr.length) return false;
  const img = art('anim/' + name), n = fr.length;
  const [fx, fy, fw, fh, ax, ay] = fr[((Math.floor(i) % n) + n) % n];
  const s = o.scale || PX;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(x), Math.round(y));
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(face * (o.sx || 1), o.sy || 1);
  ctx.drawImage(img, fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s);
  if (o.flash) { ctx.globalAlpha *= 0.85; ctx.drawImage(whiteOf(img), fx, fy, fw, fh, -ax * s, -ay * s, fw * s, fh * s); }
  ctx.restore();
  return true;
}
// (legacy) row of each Act I background where its painted floor starts
const BG_FLOOR = { hall: 237, cave: 237, crypt: 237, camp: 237, boss: 237 };
function loadArt(dir, n, tries = 0) {
  const img = new Image();
  img.onload = () => {
    ART[dir + '/' + n] = img;
    try { if (G && G.room && G.room.terrain && dir === 'props') G.room.terrain = bakeTerrain(G.room); } catch (e) { /* game not started yet */ }
  };
  img.onerror = () => { if (tries < 3) setTimeout(() => loadArt(dir, n, tries + 1), 400 * (tries + 1)); };
  img.src = `assets/${dir}/${n}.png` + (tries ? `?r=${tries}` : '');
}
for (const [dir, names] of Object.entries(ART_FILES)) for (const n of names) loadArt(dir, n);
const art = k => ART[k] || null;
const whiteCache = new Map();
function whiteOf(img) { // solid white silhouette for hit flashes
  let c = whiteCache.get(img);
  if (!c) {
    c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    whiteCache.set(img, c);
  }
  return c;
}
// draw a sprite with its bottom-centre at (cx, by); face -1 mirrors it. opts: sx, sy (squash), alpha, flash, rot, scale, center
function drawSprite(img, cx, by, face = 1, o = {}) {
  if (!img) return;
  const C = o.g || ctx;
  const s = (o.scale || PX), w = img.width * s * (o.sx || 1), h = img.height * s * (o.sy || 1);
  C.save();
  C.imageSmoothingEnabled = false;
  if (o.alpha !== undefined) C.globalAlpha *= o.alpha;
  C.translate(Math.round(cx), Math.round(o.center ? by : by - h / 2));
  if (o.rot) C.rotate(o.rot);
  if (face < 0) C.scale(-1, 1);
  C.drawImage(img, -w / 2, -h / 2, w, h);
  if (o.flash) { C.globalAlpha *= 0.85; C.drawImage(whiteOf(img), -w / 2, -h / 2, w, h); }
  C.restore();
}
// keep a character's back edge planted when switching to a wider/narrower pose
function poseX(idle, img, cx, face) { return idle ? cx + face * (img.width - idle.width) * PX / 2 : cx; }

function loadBest() { try { return +localStorage.getItem('packrat_best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('packrat_best', String(v)); } catch (e) {} }
let BEST = loadBest();

// ---------- input ----------
const keys = {}; let pressed = {};
const norm = k => k.length === 1 ? k.toLowerCase() : k;
addEventListener('keydown', e => {
  const k = norm(e.key);
  SFX.init();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[norm(e.key)] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const down = (...ks) => ks.some(k => keys[k]);
const hit = (...ks) => ks.some(k => pressed[k]);

const mouse = { x: 0, y: 0 };
function mpos(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height; }
cv.addEventListener('mousemove', e => {
  mpos(e);
  if (!G && SCREEN === 'class') { const c = classCardAt(mouse); if (c && c !== selClass) { selClass = c; SFX.play('rotate'); } }
});
cv.addEventListener('mousedown', e => { SFX.init(); mpos(e); onMouseDown(e.button); e.preventDefault(); });
addEventListener('mouseup', e => { mpos(e); onMouseUp(e.button); });
cv.addEventListener('contextmenu', e => e.preventDefault());

// =====================================================================
//  SOUND — tiny built-in retro synth (Web Audio). No audio files needed.
// =====================================================================
const SFX = (() => {
  let ac = null, out = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('packrat_muted') === '1'; } catch (e) {}
  const VOL = 0.55, last = {};
  function init() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      out = ac.createGain(); out.gain.value = muted ? 0 : VOL;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
      out.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function env(g, t, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  // pitched blip: square/triangle/sawtooth/sine with a pitch sweep
  function tone({ type = 'square', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, attack = 0.004, delay = 0, vib = 0 }) {
    const t = ac.currentTime + delay, osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib; lg.gain.value = f0 * 0.05; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05); }
    env(g, t, vol, attack, dur);
    osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + dur + 0.05);
  }
  // filtered noise: whooshes, impacts, explosions, rattles
  function noise({ dur = 0.1, vol = 0.2, f0 = 1000, f1 = f0, q = 1, filter = 'bandpass', delay = 0, attack = 0.002 }) {
    const t = ac.currentTime + delay, src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; fl.type = filter; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, vol, attack, dur);
    src.connect(fl); fl.connect(g); g.connect(out); src.start(t, Math.random()); src.stop(t + dur + 0.05);
  }
  const notes = (seq, type, vol, step, len, start = 0) => seq.forEach((f, i) => tone({ type, f0: f, dur: len, vol, delay: start + i * step }));
  const v = () => 0.93 + Math.random() * 0.14; // small random pitch change so repeats don't sound robotic

  const S = {
    // --- player ---
    swing: heavy => { const p = v() * (heavy ? 0.65 : 1); noise({ dur: heavy ? 0.18 : 0.13, vol: 0.22, f0: 450 * p, f1: 2600 * p, q: 1.3, attack: 0.02 }); },
    bow: () => { tone({ type: 'triangle', f0: 1100 * v(), f1: 260, dur: 0.12, vol: 0.16 }); noise({ dur: 0.05, vol: 0.08, f0: 4500, filter: 'highpass' }); },
    jump: () => tone({ type: 'square', f0: 240 * v(), f1: 560, dur: 0.12, vol: 0.08 }),
    land: () => noise({ dur: 0.08, vol: 0.2, f0: 420, f1: 110, filter: 'lowpass' }),
    hit: () => { const p = v(); tone({ type: 'square', f0: 260 * p, f1: 70, dur: 0.08, vol: 0.13 }); noise({ dur: 0.07, vol: 0.24, f0: 2000 * p, f1: 300, filter: 'lowpass' }); },
    crit: () => { S.hit(); tone({ type: 'square', f0: 110, f1: 40, dur: 0.16, vol: 0.14 }); tone({ type: 'triangle', f0: 1500, f1: 2000, dur: 0.14, vol: 0.12, delay: 0.02 }); },
    hurt: () => { tone({ type: 'sawtooth', f0: 420, f1: 110, dur: 0.2, vol: 0.15 }); noise({ dur: 0.12, vol: 0.22, f0: 1300, f1: 200, filter: 'lowpass' }); },
    clank: () => { tone({ type: 'triangle', f0: 1900 * v(), dur: 0.1, vol: 0.1 }); tone({ type: 'square', f0: 2900 * v(), f1: 2600, dur: 0.05, vol: 0.035 }); },
    death: () => { tone({ type: 'sawtooth', f0: 300, f1: 60, dur: 0.5, vol: 0.15 }); notes([440, 370, 311, 247, 196], 'square', 0.1, 0.22, 0.3, 0.35); },
    potion: () => { for (let i = 0; i < 3; i++) tone({ type: 'sine', f0: 260 + i * 90, f1: 440 + i * 90, dur: 0.07, vol: 0.16, delay: i * 0.09 }); notes([784, 988, 1175], 'triangle', 0.1, 0.07, 0.16, 0.3); },
    bomb: () => { noise({ dur: 0.75, vol: 0.55, f0: 2600, f1: 60, filter: 'lowpass', attack: 0.005 }); tone({ type: 'sine', f0: 140, f1: 30, dur: 0.6, vol: 0.4 }); },
    // --- enemies ---
    spawn: () => noise({ dur: 0.2, vol: 0.08, f0: 2200, f1: 400, q: 2 }),
    slimeHop: () => tone({ type: 'sine', f0: 170 * v(), f1: 360, dur: 0.09, vol: 0.06 }),
    ghostAppear: () => tone({ type: 'sine', f0: 240, f1: 620, dur: 0.4, vol: 0.05, vib: 6, attack: 0.12 }),
    rattle: () => { for (let i = 0; i < 3; i++) noise({ dur: 0.03, vol: 0.1, f0: 3000 + Math.random() * 1500, q: 5, delay: i * 0.06 }); },
    enemySwing: () => noise({ dur: 0.15, vol: 0.16, f0: 300, f1: 1500, q: 1.2, attack: 0.02 }),
    enemyBow: () => tone({ type: 'triangle', f0: 700 * v(), f1: 200, dur: 0.13, vol: 0.12 }),
    growl: () => tone({ type: 'sawtooth', f0: 85 * v(), f1: 130, dur: 0.55, vol: 0.13, vib: 14 }),
    thud: () => { tone({ type: 'sine', f0: 120, f1: 40, dur: 0.25, vol: 0.35 }); noise({ dur: 0.15, vol: 0.2, f0: 320, f1: 60, filter: 'lowpass' }); },
    slam: () => { S.thud(); noise({ dur: 0.55, vol: 0.3, f0: 900, f1: 60, filter: 'lowpass' }); },
    summon: () => { tone({ type: 'sine', f0: 300, f1: 900, dur: 0.6, vol: 0.12, vib: 7 }); tone({ type: 'sine', f0: 450, f1: 1350, dur: 0.6, vol: 0.07, vib: 5 }); },
    bossRoar: () => { tone({ type: 'sawtooth', f0: 70, f1: 160, dur: 0.4, vol: 0.22 }); tone({ type: 'sawtooth', f0: 160, f1: 55, dur: 0.7, vol: 0.22, delay: 0.4 }); noise({ dur: 1.0, vol: 0.18, f0: 600, f1: 100, filter: 'lowpass' }); },
    kill_slime: () => { tone({ type: 'sine', f0: 380 * v(), f1: 70, dur: 0.2, vol: 0.25 }); noise({ dur: 0.12, vol: 0.15, f0: 700, f1: 150, filter: 'lowpass' }); },
    kill_bat: () => { tone({ type: 'square', f0: 1800 * v(), f1: 2600, dur: 0.05, vol: 0.07 }); tone({ type: 'square', f0: 2400, f1: 900, dur: 0.12, vol: 0.07, delay: 0.05 }); },
    kill_skeleton: () => { for (let i = 0; i < 5; i++) noise({ dur: 0.04, vol: 0.2, f0: 2500 + Math.random() * 2000, q: 4, delay: i * 0.045 + Math.random() * 0.02 }); },
    kill_archer: () => tone({ type: 'sawtooth', f0: 260 * v(), f1: 90, dur: 0.22, vol: 0.14 }),
    kill_ghost: () => tone({ type: 'triangle', f0: 900 * v(), f1: 180, dur: 0.6, vol: 0.17, vib: 9 }),
    kill_brute: () => { tone({ type: 'sawtooth', f0: 140 * v(), f1: 45, dur: 0.45, vol: 0.2 }); noise({ dur: 0.3, vol: 0.25, f0: 500, f1: 80, filter: 'lowpass' }); },
    dash: () => { noise({ dur: 0.16, vol: 0.2, f0: 900, f1: 3800, q: 1.4, attack: 0.01 }); tone({ type: 'triangle', f0: 300, f1: 700, dur: 0.1, vol: 0.06 }); },
    fireball: () => { noise({ dur: 0.3, vol: 0.18, f0: 600, f1: 2000, q: 0.8, attack: 0.03 }); tone({ type: 'sawtooth', f0: 160, f1: 90, dur: 0.25, vol: 0.06 }); },
    blink: () => { tone({ type: 'sine', f0: 1200, f1: 300, dur: 0.25, vol: 0.1, vib: 20 }); noise({ dur: 0.2, vol: 0.06, f0: 6000, filter: 'highpass' }); },
    block: () => { tone({ type: 'triangle', f0: 2200 * v(), dur: 0.12, vol: 0.14 }); tone({ type: 'square', f0: 3300, f1: 2800, dur: 0.06, vol: 0.05 }); noise({ dur: 0.05, vol: 0.12, f0: 5000, filter: 'highpass' }); },
    flame: () => { noise({ dur: 0.6, vol: 0.2, f0: 300, f1: 1400, q: 0.7, attack: 0.08 }); },
    crumble: () => { noise({ dur: 0.35, vol: 0.22, f0: 800, f1: 120, filter: 'lowpass' }); for (let i = 0; i < 3; i++) noise({ dur: 0.05, vol: 0.12, f0: 1500 + i * 400, q: 3, delay: 0.05 + i * 0.07 }); },
    lava: () => { noise({ dur: 0.4, vol: 0.25, f0: 3000, f1: 600, q: 1, attack: 0.005 }); tone({ type: 'sawtooth', f0: 380, f1: 120, dur: 0.25, vol: 0.12 }); },
    spikes: () => { tone({ type: 'square', f0: 900, f1: 300, dur: 0.12, vol: 0.12 }); noise({ dur: 0.08, vol: 0.18, f0: 4000, filter: 'highpass' }); },
    kill_imp: () => { noise({ dur: 0.4, vol: 0.2, f0: 2500, f1: 300, q: 0.8 }); tone({ type: 'square', f0: 900, f1: 1600, dur: 0.12, vol: 0.06 }); },
    kill_golem: () => { tone({ type: 'sine', f0: 90, f1: 30, dur: 0.6, vol: 0.35 }); noise({ dur: 0.7, vol: 0.3, f0: 700, f1: 60, filter: 'lowpass' }); for (let i = 0; i < 4; i++) noise({ dur: 0.06, vol: 0.15, f0: 900 + i * 300, q: 3, delay: 0.1 + i * 0.09 }); },
    kill_cultist: () => { tone({ type: 'sine', f0: 600, f1: 120, dur: 0.6, vol: 0.15, vib: 12 }); tone({ type: 'triangle', f0: 900, f1: 200, dur: 0.5, vol: 0.08, delay: 0.05 }); },
    kill_spider: () => { for (let i = 0; i < 4; i++) noise({ dur: 0.05, vol: 0.16, f0: 2500 + Math.random() * 2500, q: 4, delay: i * 0.04 }); tone({ type: 'square', f0: 700, f1: 200, dur: 0.15, vol: 0.06 }); },
    kill_knight: () => { tone({ type: 'triangle', f0: 1400, f1: 900, dur: 0.2, vol: 0.12 }); noise({ dur: 0.4, vol: 0.22, f0: 1600, f1: 200, filter: 'lowpass', delay: 0.05 }); tone({ type: 'sawtooth', f0: 160, f1: 60, dur: 0.4, vol: 0.12, delay: 0.1 }); },
    petKo: () => { tone({ type: 'sine', f0: 700, f1: 200, dur: 0.4, vol: 0.12 }); },
    bark: () => { const p = v(); tone({ type: 'sawtooth', f0: 420 * p, f1: 260, dur: 0.08, vol: 0.12 }); noise({ dur: 0.06, vol: 0.12, f0: 900, q: 1.5 }); tone({ type: 'sawtooth', f0: 380 * p, f1: 240, dur: 0.07, vol: 0.1, delay: 0.11 }); },
    meow: () => tone({ type: 'triangle', f0: 600 * v(), f1: 900, dur: 0.12, vol: 0.08, vib: 9 }),
    chirp: () => { notes([2200 * v(), 2800], 'sine', 0.06, 0.05, 0.05); },
    flap: () => { noise({ dur: 0.12, vol: 0.14, f0: 1200, f1: 500, q: 1 }); noise({ dur: 0.08, vol: 0.1, f0: 900, q: 1, delay: 0.07 }); },
    phoenix: () => { noise({ dur: 0.9, vol: 0.3, f0: 400, f1: 3000, q: 0.6, attack: 0.1 }); notes([523, 784, 1047, 1568], 'triangle', 0.12, 0.09, 0.3, 0.2); },
    kill_boss: () => { S.bomb(); tone({ type: 'sawtooth', f0: 200, f1: 30, dur: 1.4, vol: 0.22 }); notes([523, 659, 784, 1047, 1319], 'square', 0.09, 0.12, 0.25, 0.9); },
    // --- world & UI ---
    clear: () => notes([523, 659, 784, 1047], 'square', 0.07, 0.08, 0.14),
    merge: () => { tone({ type: 'sine', f0: 220, f1: 880, dur: 0.22, vol: 0.12 }); notes([659, 784, 988, 1319, 1568], 'triangle', 0.11, 0.05, 0.2, 0.12); noise({ dur: 0.3, vol: 0.06, f0: 5000, filter: 'highpass', delay: 0.12 }); },
    chest: rare => { noise({ dur: 0.15, vol: 0.12, f0: 300, f1: 900, q: 3 }); notes(rare ? [784, 988, 1175, 1568, 1976] : [880, 1109, 1319], 'triangle', 0.12, 0.07, 0.2, 0.12); },
    rest: () => notes([392, 494, 587, 784], 'triangle', 0.12, 0.15, 0.35),
    door: () => { tone({ type: 'sawtooth', f0: 80, f1: 130, dur: 0.3, vol: 0.06 }); noise({ dur: 0.25, vol: 0.06, f0: 500, f1: 200, q: 2 }); },
    bag: () => { noise({ dur: 0.12, vol: 0.12, f0: 1500, f1: 700, q: 0.8 }); noise({ dur: 0.1, vol: 0.08, f0: 900, q: 0.8, delay: 0.08 }); },

// picks the song for what's happening and feeds the "danger" level to the drums
function musicDirector(dt) {
  if (!SFX.ac) return;
  let want = 'title';
  if (G) {
    const R = G.room;
    if (G.mode === 'dead') want = 'death';
    else if (G.mode === 'won') want = 'victory';
    else if (R.type === 'camp') want = 'camp';
    else if (R.type === 'boss') want = G.enemies.some(e => e.type === 'boss') ? 'boss' : 'camp';
    else want = R.act === 2 ? 'act2' : 'act1';
    const P = G.player, near = G.enemies.filter(e => e.awake && !e.dead && Math.hypot(e.x - P.x, e.y - P.y) < 650).length;
    G.musicI = (G.musicI || 0) + (Math.min(1, near / 3) - (G.musicI || 0)) * Math.min(1, dt * 1.5);
    Music.intensity = G.musicI;
    Music.setDuck(G.mode === 'pause' ? 0.35 : G.mode === 'pack' ? 0.65 : 1);

let uid = 1;
function makeItem(id) { const d = ITEMS[id]; return { id, def: d, shape: d.shape.map(r => r.slice()), rot: 0, lvl: 1, x: 0, y: 0, uid: uid++, bonus: 0, boosted: false }; }

// ---------- item levels (merge two identical items of the same level -> one level higher) ----------
const MAX_LVL = 5;
const LVL_MULT = [1, 1.8, 3, 4.5, 6.5];                 // how much stronger each level's bonuses are
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
const LVL_COLOR = ['', '#ffffff', '#a5d6a7', '#81d4fa', '#ce93d8', '#ffd54f'];
const lvlMult = it => LVL_MULT[Math.min(MAX_LVL, it.lvl || 1) - 1];
// can this class use / find this item?
function itemAllowed(id, cls = G && G.cls) { const d = ITEMS[id]; return !(d.only && d.only !== cls) && !(d.not && d.not.includes(cls)); }
// human-readable bonuses for a levelled item
const WINGS_LVL = [null, [1, 0.92, false], [1, 1.104, false], [2, 1.104, false], [2, 1.242, true], [3, 1.242, true]];  // Winged Boots: air jumps, air-jump power, glide
const PHOENIX_HEAL = [0, 0.5, 0.65, 0.8, 0.9, 1];   // share of max HP a Phoenix Feather revives you with, by level
const LANTERN_TIERS = ['chests & enemies', 'buff plants', 'chest contents', 'hidden moonlit plants', 'a secret stash'];
function levelLine(it) {
  const d = it.def, m = lvlMult(it), I = v => Math.round(v * m), P = v => Math.round(Math.abs(v) * m * 100) + '%', out = [];
  if (d.dmg) out.push(`+${I(d.dmg)} damage`);
  if (d.cd) out.push(`attacks ${P(d.cd)} ${d.cd < 0 ? 'faster' : 'slower'}`);
  if (d.armor) out.push(`+${I(d.armor)} armor`);
  if (d.hp) out.push(`+${I(d.hp)} max HP`);
  if (d.speed) out.push(`+${P(d.speed)} speed`);
  if (d.thorns) out.push(`${I(d.thorns)} thorns damage`);
  if (d.healClear) out.push(`heal ${I(d.healClear)} per room`);
  if (d.lifeKill) out.push(`heal ${I(d.lifeKill)} per kill`);
  if (d.crit) out.push(`+${P(d.crit)} crit`);
  if (d.luck) out.push(`+${(d.luck * m).toFixed(1)} luck (rarer loot)`);
  if (d.reach) out.push(`+${I(d.reach)} reach`);
  if (d.bow && !d.dmg) out.push('full arrow damage');
  if (d.reveal) out.push('reveals ' + LANTERN_TIERS.slice(0, it.lvl || 1).join(', '));
  if (d.jumps) { const [j, pw, gl] = WINGS_LVL[it.lvl || 1]; out.push(`${j} air jump${j > 1 ? 's' : ''}`); if (pw > 1) out.push(`air jumps ${Math.round((pw / 0.92 - 1) * 100)}% higher`); if (gl) out.push('hold jump while falling to glide'); }
  if (d.revive) out.push(`revives you with ${Math.round(PHOENIX_HEAL[it.lvl || 1] * 100)}% health`);
  if (d.use === 'potion') out.push(`heals ${I(8)} HP`);
  if (d.use === 'bomb') out.push(`${P(1)} blast damage`);
  if (d.special) out.push(`+${Math.round(m)} per touching ${{ whetstone: 'weapon', charm: 'armor piece', treats: 'pet', fletch: 'weapon' }[d.special]}`);
  const pc = v => Math.round(v * m * 100) + '%';
  if (d.block) out.push(`${pc(d.block)} block chance`); if (d.rage) out.push(`+${I(d.rage)} damage below half health`);
  if (d.kbMul) out.push(`+${pc(d.kbMul)} knockback`); if (d.secondWind) out.push(`second wind heals ${Math.min(100, Math.round(d.secondWind * m * 100))}%`);
  if (d.pierce) out.push(`arrows pierce ${Math.min(6, I(d.pierce))}`); if (d.multishot) out.push(`+${Math.min(4, I(d.multishot))} arrows per shot`);
  if (d.slow) out.push(`slows for ${(Math.min(4, d.slow * m)).toFixed(1)}s`); if (d.explode) out.push(`${Math.round(Math.min(1.5, d.explode * m) * 100)}% splash damage`);
  if (d.poison) out.push(`${I(d.poison)} poison/s`); if (d.backstab) out.push(`backstab x${(1 + Math.min(3, d.backstab * m)).toFixed(1)}`);
  if (d.dodge) out.push(`${pc(d.dodge)} dodge`); if (d.knives) out.push(`${Math.min(3, I(d.knives))} knife per attack`);
  if (d.dashDmg) out.push(`dash hits for ${pc(d.dashDmg)} damage`); if (d.critHeal) out.push(`crits heal ${I(d.critHeal)}`);
  if (d.critMul) out.push(`crits x${(2 + Math.min(2, d.critMul * m)).toFixed(1)}`);

        const a = Math.atan2(dy, Math.abs(dx));
        if (Math.abs(a) > 0.9) continue;
        const dist = Math.hypot(dx, dy); if (dist < best) { best = dist; ang = P.face > 0 ? a : Math.PI - a; }
      }
      // tall hitbox (drawn as a thin arrow) so it also hits short enemies like slimes
      ang += spread;
      const arrow = kind === 'arrow';
      G.proj.push({ friendly: true, x: ox - 9, y: oy - 10, w: 18, h: 20, vx: Math.cos(ang) * 560, vy: Math.sin(ang) * 560, dmg, life: 2, kind,
                    pierce: arrow ? s.pierce : 0, slow: arrow ? s.slow : 0, explode: arrow ? s.explode : 0, poison: s.poison, hitSet: new Set() });
    };
    if (archer) { // archers can't melee: every attack is an arrow (full damage with a bow packed, half without)
      const ad = s.bow ? atkDmg() : Math.max(1, Math.floor(atkDmg() / 2));
      shoot(ad); for (let k = 1; k <= s.multishot; k++) shoot(ad, (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 0.13);   // Twin Quiver / Starfall spread
      SFX.play('bow');
    } else {
      SFX.play('swing', s.cdMul > 1.05);
      if (s.bow) { shoot(Math.max(1, Math.floor(atkDmg() / 2))); SFX.play('bow'); }
      for (let k = 0; k < s.knives; k++) shoot(Math.max(1, Math.floor(atkDmg() / 2)), (k - (s.knives - 1) / 2) * 0.12, 'knife');   // Throwing Knives
      if (G.cls === 'beastmaster') SFX.play('whip');
    }
  }
  if (P.swing > 0 && archer) P.swing -= dt;
  else if (P.swing > 0) {
    P.swing -= dt;
    const r = s.reachPx;
    const hb = { x: P.face > 0 ? P.x + P.w - 6 : P.x + 6 - r, y: P.y - 10, w: r, h: P.h + 16 };
    for (const e of G.enemies) {
      if (!attackable(e) || P.hitSet.has(e)) continue;
      if (overlap(hb, e)) { P.hitSet.add(e); playerHit(e, atkDmg(), P.face * 240 * s.kbMul); }
    }
  }
  // Shadowstep Boots: dashing through enemies slashes them
  if (dashing && s.dashDmg > 0) for (const e of G.enemies) if (attackable(e) && !(P.dashHits || (P.dashHits = new Set())).has(e) && overlap(P, e)) { P.dashHits.add(e); playerHit(e, Math.max(1, Math.round(atkDmg() * s.dashDmg)), P.face * 160); }
  if (hit('q')) usePotion();
  if (hit('e')) useAbility();

  // interactables
  for (const pl of R.plants || []) if (!pl.taken && plantVisible(pl) && overlap(P, { x: pl.x - 14, y: pl.y - 30, w: 28, h: 30 })) pickPlant(pl);
  for (const C of R.chests) {
    if (!plantVisible(C)) continue;
    if (!C.seen && inView(C.x, C.y, 0)) C.seen = true;
    if (!C.open && overlap(P, C)) {
      C.open = true;
      const it = makeItem(chestLoot(C, R));
      burst(C.x + C.w / 2, C.y, RARITY[it.def.rarity].c, 24, 260);
      SFX.play('chest', it.def.rarity === 'rare');
      openPack([it]);
      if (C.secret) showMsg(`Secret stash: ${it.def.name}!`, 2.8); else if (C.bonus) showMsg(`Hidden treasure: ${it.def.name}!`, 2.5);
      break;
    }
  }
  if (R.fire && !R.fire.used && overlap(P, R.fire)) {
    R.fire.used = true; healPlayer(Math.ceil(stats.maxHp * 0.5)); SFX.play('rest');
    showMsg('You rest by the fire and recover half your health.', 2.5);
  }
}

function contactDamage(e) {
  if (e.spawn > 0 || !e.awake) return 0;
  switch (e.type) {
    case 'slime': case 'bat': return e.dmg;
    case 'ghost': return e.visible ? e.dmg : 0;
    case 'brute': return e.state === 'charge' ? e.dmg + 1 : Math.max(1, e.dmg - 2);
    case 'boss': return e.state === 'charge' ? e.dmg + 2 : Math.max(1, e.dmg - 1);
    case 'imp': return Math.max(1, e.dmg - 2);
    case 'spider': return e.state === 'air' ? e.dmg + 2 : e.dmg;
    case 'golem': return Math.max(1, e.dmg - 1);
    default: return 0;
  }
}
const HOPPERS = new Set(['skeleton', 'archer', 'brute', 'golem', 'cultist', 'knight', 'spider']);

function updateEnemy(e, dt) {
  const P = G.player, R = G.room;
  const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2, ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
  const dx = pcx - ecx, dy = pcy - ecy, dir = Math.sign(dx) || 1, adx = Math.abs(dx);
  e.flash -= dt; e.cd -= dt; e.phase += dt;
  e.landT = (e.landT || 0) - dt; e.relT = (e.relT || 0) - dt; e.slamT = (e.slamT || 0) - dt; e.jcd2 = (e.jcd2 || 0) - dt;
  e.walkT = (e.walkT || 0) + dt * Math.abs(e.vx) / 11; // drives walk-cycle speed
  const wasGround = e.onGround;
  e.kbx *= Math.pow(0.002, dt);
  const fly = e.d.fly;

  if (e.spawn > 0) {
    e.spawn -= dt;
    if (!fly) { e.vx = 0; moveBody(e, dt); }
    return;
  }
  // enemies hold their post until you come close and they can see you (or you hit them),
  // so they stay spread around the level instead of all coming at you at once
  if (!e.awake) {
    const boss = e.type === 'boss', ranged = e.type === 'archer' || e.type === 'cultist';
    const wakeX = boss ? 560 : ranged ? 400 : 270, wakeY = boss ? 300 : 110;
    const sees = boss || e.type === 'ghost' || lineOfSight(ecx, ecy, pcx, pcy);
    if ((adx < wakeX && Math.abs(dy) < wakeY && sees) || e.hp < e.maxHp) {
      e.awake = true;
      if (e.type === 'boss') { SFX.play('bossRoar'); showMsg('THE WARDEN awakens!', 2); G.shake = 8; }
    } else { if (!fly) { e.vx = 0; moveBody(e, dt); } e.face = dir; return; }
  }

  switch (e.type) {
    case 'slime':
      if (e.onGround) {
        e.vx *= Math.pow(0.01, dt); e.t -= dt;
        if (e.t <= 0) {
          navChase(e, 150, true); // slimes hop, so they launch jumps from anywhere on the tile
          if (e.onGround) { e.vy = -rand(280, 420); e.vx = (Math.sign(e.vx) || dir) * rand(100, 170); }
          e.t = rand(0.7, 1.4); e.face = Math.sign(e.vx) || dir; if (inView(e.x, e.y)) SFX.play('slimeHop');

      break;
    case 'bat': {
      let vx, vy;
      if (e.t > 0) { e.t -= dt; vx = -dir * 110; vy = -90; }
      else { [vx, vy] = flyToward(e, pcx, pcy, 135); vy += Math.sin(e.phase * 5) * 50; }
      e.face = dir; e.vx = vx + e.kbx; e.vy = vy; moveBody(e, dt, true, true); // flyers pass through one-way ledges
      break;
    }
    case 'ghost': { // drifts straight through walls
      const cyc = e.phase % 3.6, wasVis = e.visible; e.visible = cyc < 2.3;
      if (e.visible && !wasVis && inView(e.x, e.y)) SFX.play('ghostAppear');
      const a = Math.atan2(dy, dx), sp = e.visible ? 62 : 40;
      e.x += (Math.cos(a) * sp + e.kbx) * dt; e.y += (Math.sin(a) * sp + Math.sin(e.phase * 2.5) * 25) * dt;
      e.face = dir;
      break;
    }
    case 'imp': { // hovers off to one side above you and lobs fireballs
      const side = e.x < P.x ? -1 : 1, [fvx, fvy] = flyToward(e, pcx + side * 170, P.y - 90, 125);
      e.vx = fvx + e.kbx; e.vy = fvy + Math.sin(e.phase * 4) * 30;
      moveBody(e, dt, true, true); e.face = dir;
      e.t -= dt; e.aim = e.t < 0.5;
      if (e.t <= 0) {
        const a = Math.atan2(pcy - ecy, pcx - ecx);
        G.proj.push({ friendly: false, x: ecx - 7, y: ecy - 7, w: 14, h: 14, vx: Math.cos(a) * 270, vy: Math.sin(a) * 270, dmg: e.dmg, life: 4, kind: 'fire' });
        if (inView(e.x, e.y)) SFX.play('fireball');
        e.relT = 0.25; e.t = rand(2.2, 3.2);
      }
      break;
    }
    case 'skeleton':
      e.jcd = (e.jcd || 0) - dt;
      if (e.state === 'walk') {
        navChase(e, 72);
        if (adx < 58 && Math.abs(dy) < 60) { e.vx = 0; e.face = dir; if (e.cd <= 0) { e.state = 'wind'; e.t = 0.45; SFX.play('rattle'); } }
      } else if (e.state === 'wind') {
        e.vx = 0; e.t -= dt;
        if (e.t <= 0) {
          e.state = 'swing'; e.t = 0.18; SFX.play('enemySwing');
          const hb = { x: e.face > 0 ? e.x + e.w - 4 : e.x - 50, y: e.y - 6, w: 54, h: e.h + 8 };
          if (overlap(hb, P)) hurtPlayer(e.dmg, e, 300);
        }
      } else if (e.state === 'swing') { e.t -= dt; if (e.t <= 0) { e.state = 'rest'; e.t = 0.5; } }
      else { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.cd = 0.6; } }
      break;
    case 'archer':
      e.face = dir;
      if (Math.abs(dy) > 90 || adx > 430) navChase(e, 70); else if (adx < 220) e.vx = -dir * 78; else e.vx = 0;
      e.face = dir;
      e.t -= dt; e.aim = e.t < 0.45;
      if (e.t <= 0) {
        if (inView(e.x, e.y)) SFX.play('enemyBow'); e.relT = 0.2;
        G.proj.push({ friendly: false, x: e.face > 0 ? e.x + e.w : e.x - 16, y: e.y + e.h * 0.35, w: 16, h: 4, vx: e.face * 330, dmg: e.dmg, life: 4, kind: 'arrow' });
        e.t = rand(1.7, 2.6);
      }
      break;
    case 'brute':
      if (e.state === 'walk') {
        navChase(e, 48);
        if (adx < 320 && e.cd <= 0 && Math.abs(dy) < 60) { e.state = 'wind'; e.t = 0.7; e.vx = 0; e.face = dir; SFX.play('growl'); }
      } else if (e.state === 'wind') { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'charge'; e.t = 0.75; } }
      else if (e.state === 'charge') { e.vx = e.face * 380; e.t -= dt; if (e.t <= 0) { e.state = 'rest'; e.t = 0.9; } }
      else { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.cd = rand(1.5, 2.5); } }
      break;
    case 'spider': // scuttles fast, then pounces
      if (e.state === 'walk') {
        navChase(e, 120);
        if (adx < 230 && Math.abs(dy) < 120 && e.cd <= 0 && e.onGround) { e.state = 'wind'; e.t = 0.35; e.vx = 0; e.face = dir; if (inView(e.x, e.y)) SFX.play('rattle'); }
      } else if (e.state === 'wind') { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'air'; e.vy = -430; e.vx = e.face * 400; e.onGround = false; } }
      else if (e.state === 'air') { e.vx = e.face * 400; if (e.onGround && e.vy >= 0) { e.state = 'rest'; e.t = 0.5; e.landT = 0.15; } }
      else { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.cd = rand(1.2, 2); } }
      break;
    case 'cultist': // fades out, reappears beside you, then casts a homing orb
      if (e.state === 'walk') {
        if (adx > 160 || Math.abs(dy) > 80) navChase(e, 40); else { e.vx = 0; e.face = dir; }
        e.t -= dt;
        if (e.t <= 0) { e.state = 'fade'; e.t = 0.35; e.vx = 0; if (inView(e.x, e.y)) SFX.play('blink'); burst(ecx, ecy, '#b388ff', 12, 160); }
      } else if (e.state === 'fade') {
        e.vx = 0; e.t -= dt; e.alpha = Math.max(0, e.t / 0.35);
        if (e.t <= 0) {
          const ptx = Math.floor(pcx / TILE), pty = Math.floor((P.y + P.h - 1) / TILE);
          const spots = R.reachArr.filter(([x, y]) => { const ax = Math.abs(x - ptx); return ax >= 4 && ax <= 9 && Math.abs(y - pty) <= 3; });
          if (spots.length) { const [x, y] = pick(spots); e.x = (x + 0.5) * TILE - e.w / 2; e.y = (y + 1) * TILE - e.h; e.vy = 0; }
          e.state = 'appear'; e.t = 0.3; burst(e.x + e.w / 2, e.y + e.h / 2, '#b388ff', 12, 160);
        }
      } else if (e.state === 'appear') { e.vx = 0; e.t -= dt; e.alpha = 1 - Math.max(0, e.t / 0.3); if (e.t <= 0) { e.state = 'wind'; e.t = 0.7; e.alpha = 1; } }
      else if (e.state === 'wind') {
        e.vx = 0; e.face = dir; e.t -= dt;
        if (e.t <= 0) {
          G.proj.push({ friendly: false, kind: 'orb', x: ecx - 8 + e.face * 14, y: e.y + 8, w: 16, h: 16, vx: e.face * 80, vy: -40, dmg: e.dmg, life: 5, homing: true });
          SFX.play('summon'); e.relT = 0.25; e.state = 'walk'; e.t = rand(3.5, 5);

    case 'knight': // shield up while walking — hit it from behind, or while it lunges / recovers
      if (e.state === 'walk') {

      } else if (e.state === 'wind') { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'lunge'; e.t = 0.25; e.hitDone = false; SFX.play('enemySwing'); } }
      else if (e.state === 'lunge') {
        e.vx = e.face * 320; e.t -= dt;
        if (!e.hitDone) { const hb = { x: e.face > 0 ? e.x + e.w - 4 : e.x - 46, y: e.y + 4, w: 50, h: e.h - 8 }; if (overlap(hb, P) && hurtPlayer(e.dmg, e, 320)) e.hitDone = true; }
        if (e.t <= 0) { e.state = 'rest'; e.t = 0.9; e.vx = 0; }
      } else { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.cd = rand(0.8, 1.5); } }
      break;
    case 'golem': // slow; slams the ground, sending fire shockwaves both ways
      if (e.state === 'walk') {
        navChase(e, 40);
        if (adx < 170 && Math.abs(dy) < 90 && e.cd <= 0 && e.onGround) { e.state = 'wind'; e.t = 0.8; e.vx = 0; e.face = dir; SFX.play('growl'); }
      } else if (e.state === 'wind') {
        e.vx = 0; e.t -= dt;
        if (e.t <= 0) {
          e.state = 'rest'; e.t = 1.0; e.slamT = 0.4; G.shake = Math.max(G.shake, 10); SFX.play('slam');

          for (const s of [-1, 1]) G.proj.push({ friendly: false, x: fx - 13, y: fy - 22, w: 26, h: 22, vx: s * 260, dmg: e.dmg, life: 2.5, kind: 'firewave' });
          if (Math.hypot(pcx - fx, pcy - fy) < 80) hurtPlayer(e.dmg + 1, e, 380);
          burst(fx, fy, '#ff8a50', 24, 260, 5);
        }
      } else { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.cd = rand(1.8, 2.8); } }
      break;
    case 'boss': updateBoss(e, dt, dir, adx); break;

    // don't let walkers get stranded on a ledge above you

      if (e.highT > 1.2) { e.dropT = 0.3; e.highT = 0; }
    } else e.highT = 0;
    const keep = e.vx; e.vx += e.kbx; moveBody(e, dt, e.dropT > 0); e.vx = keep;

      else if (e.onGround && e.state === 'walk' && HOPPERS.has(e.type) && e.jcd2 <= 0) { e.vy = (e.type === 'brute' || e.type === 'golem') ? -560 : -600; e.jcd2 = 0.8; } // hop over walls while chasing
    }

      for (const s of [-1, 1]) G.proj.push({ friendly: false, x: ecx - 13, y: e.y + e.h - 22, w: 26, h: 22, vx: s * 300, dmg: e.dmg, life: 4, kind: 'wave' });

    if (hurtPlayer(cd, e, e.state === 'charge' ? 440 : 260) && e.type === 'bat') e.t = 0.9;
  }
}

function updateBoss(e, dt, dir, adx) {
  if (e.state === 'walk') {
    navChase(e, 55); e.t -= dt;
    if (e.t <= 0) {
      e.face = dir;
      const minions = G.enemies.filter(m => m.minion && !m.dead).length;
      const choice = wpick([['charge', adx > 140 ? 3 : 1], ['slam', 2.5], ['summon', minions < 3 ? 1.6 : 0]]);
      e.vx = 0;
      if (choice === 'charge') { e.state = 'wind'; e.t = 0.75; SFX.play('growl'); }
      else if (choice === 'slam') { e.state = 'crouch'; e.t = 0.5; }
      else { e.state = 'summon'; e.t = 0.9; SFX.play('summon'); }
    }
  } else if (e.state === 'wind') { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'charge'; e.t = 0.9; } }
  else if (e.state === 'charge') { e.vx = e.face * 420; e.t -= dt; if (e.t <= 0) { e.state = 'rest'; e.t = 0.8; } }
  else if (e.state === 'crouch') { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'air'; e.vy = -720; e.onGround = false; e.vx = dir * 120; } }
  else if (e.state === 'air') { /* handled on landing */ }
  else if (e.state === 'summon') {
    e.vx = 0; e.t -= dt;
    if (e.t <= 0) {
      for (let i = 0; i < 2; i++) {
        const type = Math.random() < 0.5 ? 'bat' : 'slime';
        const m = makeEnemy(type, Math.max(1, G.roomNum - 4), e.x + e.w / 2 + rand(-60, 60), type === 'bat' ? e.y : e.y + 20);
        m.minion = true; m.spawn = 0.4; m.awake = true; G.enemies.push(m);
        burst(m.x + m.w / 2, m.y + m.h / 2, '#b388ff', 12, 160);
      }
      e.state = 'rest'; e.t = 0.6;
    }
  } else { e.vx = 0; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.t = rand(1.0, 1.8) * (e.hp < e.maxHp / 2 ? 0.6 : 1); } }
}

function updateProj(dt) {
  const P = G.player, R = G.room;
  for (const p of G.proj) {
    if (p.homing) { // cultist orbs slowly curve toward you
      const a = Math.atan2(P.y + P.h / 2 - (p.y + p.h / 2), P.x + P.w / 2 - (p.x + p.w / 2)), k = Math.min(1, dt * 1.6);
      p.vx += (Math.cos(a) * 150 - p.vx) * k; p.vy += (Math.sin(a) * 150 - p.vy) * k;
    }
    p.x += p.vx * dt; p.y += (p.vy || 0) * dt; p.life -= dt;
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    if (p.kind === 'wave' || p.kind === 'firewave') { // shockwaves run along the floor until they hit a wall or an edge
      const front = p.vx > 0 ? p.x + p.w : p.x, under = tileAt(Math.floor(cx / TILE), Math.floor((p.y + p.h + 4) / TILE));
      if (isSolidT(tileAt(Math.floor(front / TILE), Math.floor((p.y + p.h - 6) / TILE))) || !(isSolidT(under) || under === ONEWAY)) p.dead = true;
      if (p.kind === 'firewave' && Math.random() < 0.5) G.parts.push({ x: cx + rand(-10, 10), y: p.y + p.h - 4, vx: rand(-20, 20), vy: rand(-140, -60), life: 0.35, max: 0.35, color: pick(['#ff7a2a', '#ffcf5a']), size: rand(3, 5), grav: -60 });
    } else if (isSolidT(tileAt(Math.floor(cx / TILE), Math.floor(cy / TILE)))) {
      p.dead = true; burst(cx, cy, p.kind === 'fire' ? '#ff7043' : p.kind === 'orb' ? '#b388ff' : '#bcaaa4', 5, 90, 3);
    }
    if (p.kind === 'arcane') G.parts.push({ x: cx + rand(-6, 6), y: cy + rand(-6, 6), vx: -p.vx * 0.05 + rand(-30, 30), vy: rand(-30, 30), life: 0.45, max: 0.45, color: pick(['#ea80fc', '#b388ff', '#e1bee7']), size: rand(2, 5), grav: 0 });
    if ((p.kind === 'fire' || p.kind === 'petfire') && Math.random() < 0.7) G.parts.push({ x: cx, y: cy, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.3, max: 0.3, color: pick(['#ff7a2a', '#ffcf5a', '#ff3d00']), size: rand(2, 5), grav: -40 });

    if (p.friendly) {

function updateWorld(dt) {
  const R = G.room;
  updatePlayer(dt);
  if (G.mode !== 'play' && G.mode !== 'pack') { updateFx(dt); return; }
  if (R.cleared) R.openT += dt;
  updateHazards(dt);
  R.navT = (R.navT || 0) - dt;
  if (R.navT <= 0) { updateNavFields(); R.navT = 0.3; }
  for (const e of G.enemies) if (!e.dead) { const k = tickStatus(e, dt); if (!e.dead) updateEnemy(e, dt * k); }
  updatePets(dt);
  updateBuffs(dt);
  updateWolves(dt);
  G.enemies = G.enemies.filter(e => !e.dead);
  updateProj(dt);
  updateFx(dt);
  updateCamera(dt);

  if (!R.cleared && G.enemies.every(e => e.minion) && G.mode === 'play') {
    R.cleared = true;
    healPlayer(stats.healClear);
    SFX.play('clear');
    const lk = R.lastKill || { x: G.player.x + G.player.w / 2, y: G.player.y };
    const gy = groundBelow(lk.x, lk.y);
    R.chests.push({ x: clamp(lk.x, TILE + 20, R.wpx - TILE - 20) - 19, y: gy - 30, w: 38, h: 30, open: false, rare: R.type === 'boss', seen: true });
    burst(lk.x, gy - 20, '#ffd54f', 20, 220);
    G.proj = G.proj.filter(p => p.friendly);
    showMsg(R.type === 'boss' ? 'The Warden falls! Claim your treasure.' : 'Floor cleared! Grab the loot, then find the exit (green on the map).', 3);
  }
}

function syncPets() {

function updatePets(dt) {

          G.proj.push({ friendly: true, kind: 'petfire', x: cx - 8, y: cy - 8, w: 16, h: 16, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, dmg: petDamage(p), life: 1.6 });

    }
    // enemies hurt pets they touch, and enemy shots can hit them
    for (const e of G.enemies) { const c2 = contactDamage(e); if (c2 > 0 && overlap(e, p)) hurtPet(p, Math.max(1, c2 - 1)); }

}
function drawPets() {
  for (const p of G.pets || []) {
    const cx = p.x + p.w / 2, o = {};

// =====================================================================
//  BACKPACK SCREEN
// =====================================================================
const CELL = 54, GX = 210, GY = 92, SC = 22;
const STAGE = { x: 210, y: 336, w: 360, h: 134 };
const TRASH = { x: 586, y: 336, w: 164, h: 134 };
const CLOSE = { x: 390, y: 486, w: 180, h: 36 };
let PK = null;

function openPack(newItems) {
  G.mode = 'pack';
  SFX.play('bag');
  PK = { staging: newItems.slice(), drag: null, warn: false, startMax: stats.maxHp };
  stats = computeStats();
  if (newItems.length) showMsg(`Found: ${newItems.map(i => i.def.name).join(', ')}!`, 2.5);
}
function tryOpenPack() {
  if (G.room.cleared) openPack([]);
  else { showMsg("You can't rummage through your pack mid-fight!", 1.6); SFX.play('error'); }
}
function closePack() {
  if (PK.drag) return;
  if (PK.staging.length && !PK.warn) { PK.warn = true; showMsg('Unplaced items will be left behind! Press again to leave them.', 2.5); SFX.play('error'); return; }
  SFX.play('bag');
  stats = computeStats();
  const P = G.player;
  if (stats.maxHp > PK.startMax) P.hp += stats.maxHp - PK.startMax;
  P.hp = Math.min(P.hp, stats.maxHp);
  PK = null; G.mode = 'play';
  syncPets();
}
function stagingLayout() {
  let sx = STAGE.x + 14; const out = [];
  for (const it of PK.staging) {
    const w = it.shape[0].length, h = it.shape.length;
    out.push({ it, x: sx, y: STAGE.y + 32 + (STAGE.h - 40 - h * SC) / 2 });
    sx += w * SC + 18;
  }
  return out;
}
function stagingAt(p) {
  for (const s of stagingLayout()) for (const [c, r] of cells(s.it, 0, 0)) {
    if (p.x >= s.x + c * SC && p.x < s.x + (c + 1) * SC && p.y >= s.y + r * SC && p.y < s.y + (r + 1) * SC) return s.it;
  }
  return null;
}
function gridCellAt(p) {
  const c = Math.floor((p.x - GX) / CELL), r = Math.floor((p.y - GY) / CELL);
  return (c >= 0 && c < PW && r >= 0 && r < PH) ? [c, r] : null;
}
function onMouseDown(btn) {
  if (!G) {
    if (btn !== 0) return;
    if (SCREEN === 'title') { SCREEN = 'class'; SFX.play('pick'); return; }
    const c = classCardAt(mouse); if (c) newGame(c);
    return;
  }
  if (G.mode === 'dead') { if (btn === 0 && G.deadT > 0.8) { G = null; SCREEN = 'class'; } return; }
  if (G.mode !== 'pack' || !PK) return;
  if (btn === 2) { if (PK.drag) rotateDrag(); else rotateHovered(); return; }
  if (btn !== 0) return;
  if (inRect(mouse, CLOSE)) { closePack(); return; }
  const gc = gridCellAt(mouse);
  if (gc) {
    const it = itemAtCell(gc[0], gc[1]);
    if (it) {
      PK.drag = { it, from: 'grid', ox: it.x, oy: it.y, oshape: it.shape, orot: it.rot, offX: mouse.x - (GX + it.x * CELL), offY: mouse.y - (GY + it.y * CELL) };
      pack = pack.filter(i => i !== it); stats = computeStats(); SFX.play('pick');
    }
    return;
  }
  const st = stagingAt(mouse);
  if (st) {
    PK.staging = PK.staging.filter(i => i !== st); SFX.play('pick');
    PK.drag = { it: st, from: 'staging', offX: st.shape[0].length * CELL / 2, offY: st.shape.length * CELL / 2 };
  }
}
function dropTarget() {
  const d = PK.drag;
  return { gx: Math.round((mouse.x - d.offX - GX) / CELL), gy: Math.round((mouse.y - d.offY - GY) / CELL) };
}
// is the dragged item being dropped onto an identical item it can merge with?
function mergeCheck(it) {
  const gc = gridCellAt(mouse); if (!gc) return null;
  const t = itemAtCell(gc[0], gc[1]);
  if (!t || t === it || t.id !== it.id) return null;
  const a = t.lvl || 1, b = it.lvl || 1;
  if (a !== b) return { t, ok: false, why: `Only items of the same level can merge (that one is level ${ROMAN[a]}).` };
  if (a >= MAX_LVL) return { t, ok: false, why: 'That item is already at max level (V).' };
  return { t, ok: true, lvl: a + 1 };
}
function onMouseUp(btn) {
  if (btn !== 0 || !G || G.mode !== 'pack' || !PK || !PK.drag) return;

  const mc = mergeCheck(it);

    PK.flash = { it: mc.t, t: 0.6 }; SFX.play('merge');
    showMsg(`Merged! ${it.def.name} is now level ${ROMAN[mc.lvl]}.`, 2);
    return;
  }
  if (mc) showMsg(mc.why, 1.8);
  const overGrid = mouse.x >= GX && mouse.x < GX + PW * CELL && mouse.y >= GY && mouse.y < GY + PH * CELL;
  if (canPlace(it.shape, gx, gy)) { it.x = gx; it.y = gy; pack.push(it); PK.warn = false; SFX.play('place'); }
  else if (inRect(mouse, TRASH)) { showMsg(`Discarded ${it.def.name}.`, 1.5); SFX.play('trash'); }
  else if (inRect(mouse, STAGE)) { PK.staging.push(it); SFX.play('place'); }
  else if (d.from === 'grid') { it.shape = d.oshape; it.rot = d.orot; it.x = d.ox; it.y = d.oy; pack.push(it); SFX.play(overGrid ? 'error' : 'place'); }
  else { PK.staging.push(it); SFX.play(overGrid ? 'error' : 'place'); }
  PK.drag = null; stats = computeStats();
}
function rotateDrag() {
  const d = PK.drag; d.it.shape = rotateShape(d.it.shape); d.it.rot = ((d.it.rot || 0) + 1) % 4; SFX.play('rotate');
  d.offX = d.it.shape[0].length * CELL / 2; d.offY = d.it.shape.length * CELL / 2;
}
function rotateHovered() {
  const st = !gridCellAt(mouse) && stagingAt(mouse);
  if (st) { st.shape = rotateShape(st.shape); st.rot = ((st.rot || 0) + 1) % 4; SFX.play('rotate'); return; } // spin loot in the loot box
  const gc = gridCellAt(mouse); if (!gc) return;
  const it = itemAtCell(gc[0], gc[1]); if (!it) return;
  const ns = rotateShape(it.shape);
  if (canPlace(ns, it.x, it.y, it)) { it.shape = ns; it.rot = ((it.rot || 0) + 1) % 4; stats = computeStats(); SFX.play('rotate'); }
  else { showMsg("Not enough room to rotate there.", 1.2); SFX.play('error'); }
}
function hoveredItem() {
  if (!PK) return null;

// animated hero: picks the class's animation from what the player is doing

    ctx.strokeStyle = sel ? C.color : 'rgba(255,255,255,0.12)'; ctx.lineWidth = sel ? 3 : 1.5; rr(x, y, R.w, R.h, 12); ctx.stroke();
    ctx.font = `bold 13px ${UI}`; ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.textAlign = 'left'; ctx.fillText(String(i + 1), x + 12, y + 16);
    ctx.textAlign = 'center'; ctx.font = `bold 24px ${UI}`; ctx.fillStyle = C.color; ctx.fillText(C.name, x + R.w / 2, y + 30);
    // selected class runs, the others breathe
    if (!drawAnim(cls, sel ? 'run' : 'idle', TIME * (sel ? 9 : 5), x + R.w / 2, y + 128, 1, { scale: 3 }) && hero)
      drawSprite(hero, x + R.w / 2, y + 128 + (sel ? Math.round(Math.sin(TIME * 3) * 2) : 0), 1, { scale: 3 });
    // starting kit, shown in a little backpack
    const P = CLASS_PREVIEW[cls], cs = 26, gcols = 4, grows = 3, gx = x + (R.w - gcols * cs) / 2, gy = y + 140;
    ctx.fillStyle = '#5a3b22'; rr(gx - 6, gy - 6, gcols * cs + 12, grows * cs + 12, 6); ctx.fill();
    for (let r = 0; r < grows; r++) for (let c = 0; c < gcols; c++) { ctx.fillStyle = (r + c) % 2 ? '#35251a' : '#3a291d'; ctx.fillRect(gx + c * cs + 1, gy + r * cs + 1, cs - 2, cs - 2); }
    for (const it of P.items) drawItem(it, gx + it.x * cs, gy + it.y * cs, cs);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `12px ${UI}`; ctx.fillStyle = '#cfcfcf';
    ctx.fillText(P.items.map(it => it.def.name).join(' + '), x + R.w / 2, y + 238);
    const s = P.stats;
    ctx.font = `bold 13px ${UI}`; ctx.fillStyle = '#ffe0b2';
    ctx.fillText(`⚔ ${s.dmg} dmg   ⏱ ${(1 / s.attackCd).toFixed(1)}/s${cls === 'archer' ? '   🏹 ranged' : cls === 'beastmaster' ? '   🐾 pets +1' : s.bow ? '   🏹 arrows' : ''}${s.potions ? '   🧪 ' + s.potions : ''}`, x + R.w / 2, y + 258);
    ctx.font = `12.5px ${UI}`; ctx.fillStyle = '#bdbdbd';
    wrap(C.blurb, x + R.w / 2, y + 282, R.w - 30, 16);
  });
  const C = CLASSES[selClass], a = 0.6 + 0.4 * Math.sin(TIME * 4);
  ctx.textAlign = 'center'; ctx.font = `bold 20px ${UI}`; ctx.fillStyle = `rgba(105,240,174,${a})`;
  ctx.fillText(`Press Enter to descend as the ${C.name}`, W / 2, 476);
  if (BEST) { ctx.font = `13px ${UI}`; ctx.fillStyle = '#8d8d8d'; ctx.fillText(`Deepest floor reached: ${BEST}`, W / 2, 508); }
}

function drawOverlay(title, sub, sub2) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 48px ${UI}`; ctx.fillStyle = '#fff'; ctx.fillText(title, W / 2, H / 2 - 50);
  ctx.font = `18px ${UI}`; ctx.fillStyle = '#e0e0e0'; ctx.fillText(sub, W / 2, H / 2 + 4);
  if (sub2) { ctx.font = `bold 18px ${UI}`; ctx.fillStyle = '#69f0ae'; ctx.fillText(sub2, W / 2, H / 2 + 48); }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (!G) { if (SCREEN === 'class') drawClassSelect(); else drawTitle(); return; }
  ctx.save();
  const shk = G.shake > 0.5 && G.mode === 'play' ? G.shake : 0;
  drawParallax(G.room);
  ctx.translate(Math.round(-G.cam.x + rand(-shk, shk)), Math.round(-G.cam.y + rand(-shk, shk)));  // camera follows the player
  drawTerrain(G.room);
  drawWorldDynamic(G.room);
  drawCorpses();
  for (const e of G.enemies) drawEnemy(e);
  drawPets();
  drawWolves();
  drawPlayer();
  for (const p of G.proj) drawProj(p);
  drawFx();
  ctx.restore();
  drawVignette();
  if (G.mode === 'pack') { drawPack(); drawHUDMessageOnly(); return; }
  drawHUD();
  if (G.mode === 'trans' || G.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(G.fade, 0, 1)})`; ctx.fillRect(0, 0, W, H); }
  if (G.mode === 'pause') drawOverlay('Paused', 'Press P or Esc to resume');
  if (G.mode === 'won') drawOverlay('VICTORY!', `The ${CLASSES[G.cls].name} conquered all ${FINAL_FLOOR} floors · ${G.kills} enemies slain`, G.wonT > 1 ? 'Enter: keep descending (endless)  ·  Esc: title screen' : '');
  if (G.mode === 'dead' && G.deadT > 0.5) drawOverlay('You Died', `${CLASSES[G.cls].name} fell on floor ${G.roomNum} · ${G.kills} enemies slain · ${pack.length} items carried${G.newBest ? ' · NEW BEST!' : ''}`, G.deadT > 0.8 ? 'Press Enter or click to choose a class and try again' : '');
}
function drawHUDMessageOnly() {
  if (G.msgT > 0 && G.msg) {
    ctx.globalAlpha = Math.min(1, G.msgT * 2);
    ctx.font = `bold 16px ${UI}`; const tw = ctx.measureText(G.msg).width + 32;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; rr(W / 2 - tw / 2, 50, tw, 30, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(G.msg, W / 2, 65);
    ctx.globalAlpha = 1;
  }
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
function update(dt) {
  TIME += dt;
  if (hit('m')) {
    let msg;
    if (!SFX.muted && Music.on) { Music.setOn(false); msg = 'Music off (M)'; }
    else if (!SFX.muted) { SFX.toggleMute(); msg = 'All sound off (M)'; }
    else { SFX.toggleMute(); Music.setOn(true); msg = 'Sound and music on (M)'; }
    if (G) showMsg(msg, 1.2);
  }
  musicDirector(dt);
  if (!G) {
    if (SCREEN === 'title') { if (hit('Enter', ' ')) { SCREEN = 'class'; SFX.play('pick'); } return; }
    const i = CLASS_ORDER.indexOf(selClass), before = selClass;
    const nc = CLASS_ORDER.length;
    if (hit('ArrowLeft', 'a')) selClass = CLASS_ORDER[(i + nc - 1) % nc];
    if (hit('ArrowRight', 'd')) selClass = CLASS_ORDER[(i + 1) % nc];
    if (hit('1')) selClass = 'warrior'; if (hit('2')) selClass = 'archer'; if (hit('3')) selClass = 'rogue'; if (hit('4')) selClass = 'beastmaster';
    if (selClass !== before) SFX.play('rotate');
    if (hit('Escape')) SCREEN = 'title';
    else if (hit('Enter', ' ')) newGame(selClass);
    return;
  }
  switch (G.mode) {
    case 'play':
      if (hit('p', 'Escape')) { G.mode = 'pause'; SFX.play('pause'); break; }
      if (hit('b', 'i', 'Tab')) { tryOpenPack(); if (G.mode === 'pack') break; }
      if (hit('n')) G.minimap = !G.minimap;
      updateWorld(dt);
      break;
    case 'pause':
      if (hit('p', 'Escape')) { G.mode = 'play'; SFX.play('pause'); }
      break;
    case 'pack':
      if (PK && PK.flash) PK.flash.t -= dt;
      if (hit('r')) { if (PK.drag) rotateDrag(); else rotateHovered(); }
      if (hit('b', 'i', 'Tab', 'Escape')) closePack();
      if (G.msgT > 0) G.msgT -= dt;
      break;
    case 'trans':
      G.fade += dt * 3.5 * G.fadeDir;
      if (G.fadeDir > 0 && G.fade >= 1) { G.fade = 1; nextRoom(); G.fadeDir = -1; }
      else if (G.fadeDir < 0 && G.fade <= 0) { G.fade = 0; G.fadeDir = 0; G.mode = 'play'; }
      updateFx(dt);
      break;
    case 'dead':
      G.deadT += dt; updateFx(dt);
      if (G.deadT > 0.8 && hit('Enter')) { G = null; SCREEN = 'class'; }
      break;
    case 'won':
      G.wonT += dt; updateFx(dt);
      if (G.wonT > 1 && hit('Enter')) { G.endless = true; G.mode = 'trans'; G.fadeDir = 1; G.fade = 0; }
      else if (G.wonT > 1 && hit('Escape')) { G = null; SCREEN = 'title'; }
      break;
  }
}
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.033, (t - last) / 1000); last = t;
  update(dt); draw();
  pressed = {};
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
